<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>chrome-chat</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    line-height: 1.5;
  }
  input, button, textarea { font: inherit; }
  button { cursor: pointer; }

  :root {
    --bg: #ffffff;
    --fg: #111111;
    --muted: #6e6e80;
    --border: #e5e5e5;
    --accent: #0a58ca;
    --accent-fg: #ffffff;
    --user-bubble-bg: #f0f4ff;
    --ok: #1a7f37;
    --warn: #9a6700;
    --bad: #cf222e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #212121;
      --fg: #ececf1;
      --muted: #9b9b9b;
      --border: #3a3a3a;
      --accent: #6ea8fe;
      --accent-fg: #0d1117;
      --user-bubble-bg: #2f2f3a;
      --ok: #3fb950;
      --warn: #d29922;
      --bad: #ff7b72;
    }
  }

  #app {
    display: grid;
    grid-template-columns: 260px 1fr;
    grid-template-rows: 100%;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    background: var(--bg);
    color: var(--fg);
  }

  /* --- Sidebar: always-dark, independent of prefers-color-scheme --- */
  #sidebar {
    display: flex;
    flex-direction: column;
    height: 100%;
    background: #171717;
    color: #ececf1;
  }
  .sidebar-header { flex-shrink: 0; padding: 0.75rem; }
  #new-chat-btn {
    width: 100%;
    background: transparent;
    color: #ececf1;
    border: 1px solid #4d4d4d;
    border-radius: 8px;
    padding: 0.6rem 0.75rem;
    font-size: 0.9rem;
    text-align: left;
  }
  #new-chat-btn:hover { background: #2a2a2a; }
  #thread-search {
    width: 100%; margin-top: 0.5rem;
    background: #2a2a2a; color: #ececf1; border: 1px solid #4d4d4d;
    border-radius: 8px; padding: 0.45rem 0.65rem; font-size: 0.82rem;
  }
  #thread-search::placeholder { color: #8a8a8a; }
  #thread-list { flex: 1; min-height: 0; overflow-y: auto; padding: 0 0.5rem; }
  .thread-item {
    display: flex; align-items: center; gap: 0.3rem;
    padding: 0.6rem 0.6rem; border-radius: 6px; cursor: pointer; font-size: 0.85rem;
  }
  .thread-item:hover { background: #2a2a2a; }
  .thread-item.active { background: #343541; font-weight: 600; }
  .thread-item .thread-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .thread-item .thread-rename-input {
    flex: 1; min-width: 0; background: #0d0d0d; color: #ececf1;
    border: 1px solid #6ea8fe; border-radius: 4px; padding: 0.1rem 0.4rem; font-size: 0.85rem;
  }
  .thread-item .thread-rename, .thread-item .thread-delete {
    background: transparent; color: #9b9b9b; border: none;
    padding: 0.1rem 0.4rem; font-size: 0.85rem; border-radius: 4px; flex-shrink: 0;
  }
  .thread-item .thread-rename:hover { background: #ffffff1a; color: #ececf1; }
  .thread-item .thread-delete:hover { background: #ff7b7222; color: #ff7b72; }
  .thread-item .thread-delete.confirming { background: #ff7b7222; color: #ff7b72; font-weight: 600; }
  .empty-hint { color: #9b9b9b; font-size: 0.8rem; padding: 0.6rem; }
  .thread-generating { color: #3fb950; font-size: 0.55rem; flex-shrink: 0; }
  .family-row {
    display: flex; align-items: center; gap: 0.3rem;
    padding: 0.6rem 0.6rem; border-radius: 6px; cursor: pointer; font-size: 0.85rem;
  }
  .family-row:hover { background: #2a2a2a; }
  .family-row.active { background: #343541; font-weight: 600; }
  .family-chevron { flex-shrink: 0; color: #9b9b9b; font-size: 0.7rem; width: 0.9rem; }
  .family-row .thread-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .family-count {
    flex-shrink: 0; background: #3a3a3a; color: #ececf1; font-size: 0.7rem;
    border-radius: 999px; padding: 0.05rem 0.45rem;
  }
  .family-children { margin-left: 1.1rem; border-left: 1px solid #3a3a3a; padding-left: 0.4rem; }
  .family-child-wrap { margin-bottom: 0.2rem; }
  .family-child-meta { color: #8a8a8a; font-size: 0.7rem; padding: 0 0.6rem 0.3rem; }
  .delete-fork-warning { color: #ff7b72; font-size: 0.68rem; padding: 0 0.6rem 0.4rem; }
  .sidebar-footer { flex-shrink: 0; padding: 0.75rem; border-top: 1px solid #2f2f2f; font-size: 0.75rem; color: #9b9b9b; }
  .sidebar-footer a { color: #9b9b9b; }
  .status-pill { font-weight: 600; padding: 0.1rem 0.4rem; border-radius: 4px; }
  .status-pill.available { color: var(--ok); }
  .status-pill.downloadable { color: var(--warn); }
  .status-pill.unavailable, .status-pill.missing { color: var(--bad); }

  /* --- Main column --- */
  #main-col { display: flex; flex-direction: column; height: 100%; min-width: 0; position: relative; }
  #chat-header {
    flex-shrink: 0;
    display: flex; align-items: center; gap: 0.75rem;
    padding: 0.75rem 1rem;
    border-bottom: 1px solid var(--border);
    font-size: 0.85rem;
  }
  #summarize-btn {
    margin-left: auto;
    background: transparent; border: 1px solid var(--border); color: var(--muted);
    border-radius: 6px; padding: 0.25rem 0.6rem; font-size: 0.78rem; flex-shrink: 0;
  }
  #summarize-btn:hover:not(:disabled) { color: var(--fg); background: color-mix(in srgb, var(--accent) 10%, transparent); }
  #summarize-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  #hamburger-btn {
    display: none;
    background: transparent; border: none; color: var(--fg);
    font-size: 1.2rem; padding: 0.2rem 0.4rem;
  }
  /* Everything below the header (log + composer) lives in its own flex
     column so the header stays pinned at top regardless of which of the
     two layouts below is active. */
  #chat-area { flex: 1; min-height: 0; display: flex; flex-direction: column; position: relative; }
  #scroll-bottom-btn {
    position: absolute; bottom: 88px; left: 50%; transform: translateX(-50%);
    width: 2.2rem; height: 2.2rem; border-radius: 50%;
    background: var(--bg); border: 1px solid var(--border); color: var(--fg);
    box-shadow: 0 2px 8px rgba(0,0,0,.15);
    display: flex; align-items: center; justify-content: center; font-size: 1rem;
    z-index: 5;
  }
  #scroll-bottom-btn:hover { background: color-mix(in srgb, var(--accent) 10%, var(--bg)); }
  #chat-log { flex: 1; min-height: 0; overflow-y: auto; }
  .empty-state {
    height: 100%; display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 1.1rem; text-align: center; padding: 1rem;
  }
  /* Landing layout: a brand-new, not-yet-sent chat shows its composer
     centered in the middle of the screen alongside the greeting, rather
     than docked at the bottom -- switches to the normal docked layout the
     instant the first message is sent (hasMessages flips true, .landing
     comes off #chat-area on the very next render). */
  #chat-area.landing { justify-content: center; }
  #chat-area.landing #chat-log { flex: none; overflow: visible; }
  #chat-area.landing .empty-state { height: auto; padding: 0 0 1.5rem; }

  .message-row { padding: 1.25rem clamp(1rem, 4vw, 2rem); }
  .message-row .content { max-width: 48rem; margin: 0 auto; }
  .message-row.assistant .content { text-align: left; }
  .message-row.user .content { display: flex; justify-content: flex-end; }
  .message-row.user .user-wrap { display: flex; flex-direction: column; align-items: flex-end; max-width: 70%; }
  .message-row.user .bubble {
    background: var(--user-bubble-bg);
    border-radius: 1.25rem; padding: 0.6rem 1rem;
  }
  .message-row.user .msg-actions { margin-top: 0.3rem; margin-right: 0.2rem; }
  .message-row.user .user-wrap.edit-mode { width: 100%; max-width: 34rem; align-items: stretch; }
  .edit-textarea {
    width: 100%; min-height: 3rem; max-height: 260px;
    border: 1px solid var(--accent); border-radius: 1rem;
    background: var(--bg); color: var(--fg);
    padding: 0.6rem 1rem; resize: none; overflow-y: auto; line-height: 1.4;
  }
  .edit-textarea:focus { outline: none; }
  .edit-warning { color: var(--warn); font-size: 0.78rem; margin-top: 0.4rem; text-align: right; }
  .save-edit-btn { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  .md > *:first-child { margin-top: 0; }
  .md > *:last-child { margin-bottom: 0; }
  .md p, .md ul, .md ol { margin: 0.6rem 0; }
  .md ul, .md ol { padding-left: 1.25rem; }
  .md code { background: color-mix(in srgb, var(--fg) 10%, transparent); border-radius: 4px; padding: 0.1rem 0.3rem; font-size: 0.85em; }
  .md pre { background: color-mix(in srgb, var(--fg) 8%, transparent); border-radius: 6px; padding: 0.75rem; overflow-x: auto; margin: 0.6rem 0; }
  .md pre code { background: none; padding: 0; }

  .msg-timing { color: var(--muted); font-size: 0.7rem; margin-top: 0.4rem; }
  .msg-actions { margin-top: 0.5rem; display: flex; gap: 0.4rem; }
  .msg-actions .icon-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 6px;
    padding: 0.2rem 0.55rem;
    font-size: 0.75rem;
  }
  .msg-actions .icon-btn:hover { color: var(--fg); background: color-mix(in srgb, var(--accent) 10%, transparent); }

  #composer { flex-shrink: 0; }
  .composer-shell { max-width: 48rem; margin: 0 auto; padding: 0 1rem 1rem; }
  .composer-box {
    position: relative;
    border: 1px solid var(--border);
    border-radius: 1.5rem;
    box-shadow: 0 2px 6px rgba(0,0,0,.06);
    background: var(--bg);
    padding: 0.75rem 3rem 0.75rem 2.75rem;
  }
  .composer-box textarea {
    width: 100%; border: none; resize: none; background: transparent; color: var(--fg);
    max-height: 200px; overflow-y: auto; line-height: 1.4;
  }
  .composer-box textarea:focus { outline: none; }
  .attach-btn {
    position: absolute; left: 0.5rem; bottom: 0.5rem;
    width: 2rem; height: 2rem; border-radius: 50%;
    background: transparent; color: var(--muted); border: none; font-size: 1rem;
    display: flex; align-items: center; justify-content: center;
  }
  .attach-btn:hover { background: color-mix(in srgb, var(--accent) 10%, transparent); }
  .attachment-chip {
    display: flex; align-items: center; gap: 0.5rem;
    background: color-mix(in srgb, var(--accent) 8%, var(--bg));
    border: 1px solid var(--border); border-radius: 0.75rem;
    padding: 0.4rem 0.7rem; margin-bottom: 0.5rem; font-size: 0.82rem; color: var(--fg);
  }
  .attachment-chip span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .attachment-chip button {
    background: transparent; border: none; color: var(--muted); font-size: 0.95rem; padding: 0 0.2rem;
  }
  .msg-attachment-img { max-width: 100%; max-height: 220px; border-radius: 0.75rem; margin-bottom: 0.5rem; }
  .msg-attachment-audio { width: 100%; margin-bottom: 0.5rem; }
  .msg-attachment-missing { color: var(--muted); font-size: 0.8rem; font-style: italic; margin-bottom: 0.4rem; }
  .send-btn {
    position: absolute; right: 0.5rem; bottom: 0.5rem;
    width: 2rem; height: 2rem; border-radius: 50%;
    background: var(--accent); color: var(--accent-fg); border: none;
    display: flex; align-items: center; justify-content: center; font-size: 0.9rem;
  }
  .send-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .stop-btn { background: var(--fg); color: var(--bg); }
  .composer-note { color: var(--muted); font-size: 0.78rem; text-align: center; margin-top: 0.5rem; min-height: 1.2em; }
  .composer-note.warn { color: var(--warn); font-weight: 600; }

  #sidebar-overlay { display: none; }

  @media (max-width: 768px) {
    #app { grid-template-columns: 1fr; }
    #sidebar {
      position: fixed; inset: 0 auto 0 0; width: 260px;
      transform: translateX(-100%); transition: transform .2s; z-index: 20;
    }
    #sidebar.open { transform: translateX(0); }
    #sidebar-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 10;
    }
    #sidebar-overlay.visible { display: block; }
    #hamburger-btn { display: inline-flex; }
  }
</style>
</head>
<body>
  <div id="app">
    <div id="sidebar-overlay"></div>
    <div id="sidebar">
      <div class="sidebar-header">
        <button id="new-chat-btn">+ New chat</button>
        <input type="text" id="thread-search" placeholder="Search conversations…">
      </div>
      <div id="thread-list"></div>
      <div class="sidebar-footer">
        <div>Prompt API: <span class="status-pill" id="status-pill">checking…</span></div>
        <div style="margin-top:0.35rem;"><a href="https://github.com/nlade-core/chrome-chat" target="_blank" rel="noopener">Source</a> · Chrome desktop only</div>
      </div>
    </div>

    <div id="main-col">
      <div id="chat-header">
        <button id="hamburger-btn" aria-label="Toggle sidebar">☰</button>
        <span style="color:var(--muted);">chrome-chat — Gemini Nano, 100% on-device</span>
        <button id="summarize-btn" style="display:none;">Summarize</button>
      </div>
      <div id="chat-area">
        <div id="chat-log">
          <div class="empty-state" id="empty-state">Ask something to start a new conversation.</div>
        </div>
        <button id="scroll-bottom-btn" style="display:none;" aria-label="Scroll to bottom">↓</button>
        <div id="composer">
          <div class="composer-shell">
            <div class="attachment-chip" id="attachment-chip" style="display:none;">
              <span id="attachment-name"></span>
              <button id="remove-attachment-btn" aria-label="Remove attachment">×</button>
            </div>
            <div class="composer-box">
              <button class="attach-btn" id="attach-btn" type="button" aria-label="Attach an image or audio clip">📎</button>
              <input type="file" id="attach-input" accept="image/*,audio/*" style="display:none;">
              <textarea id="chat-input" placeholder="Message chrome-chat…" rows="1"></textarea>
              <button class="send-btn" id="chat-send-btn" disabled aria-label="Send">➤</button>
              <button class="send-btn stop-btn" id="chat-stop-btn" style="display:none;" aria-label="Stop generating">■</button>
            </div>
            <div class="composer-note" id="chat-note"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { marked } from 'https://cdn.jsdelivr.net/npm/marked@18.0.11/lib/marked.esm.js';

    const statusPill = document.getElementById('status-pill');
    const newChatBtn = document.getElementById('new-chat-btn');
    const threadListEl = document.getElementById('thread-list');
    const threadSearchInput = document.getElementById('thread-search');
    const emptyStateEl = document.getElementById('empty-state');
    const chatArea = document.getElementById('chat-area');
    const chatLog = document.getElementById('chat-log');
    const scrollBottomBtn = document.getElementById('scroll-bottom-btn');
    const chatInput = document.getElementById('chat-input');
    const chatSendBtn = document.getElementById('chat-send-btn');
    const chatStopBtn = document.getElementById('chat-stop-btn');
    const attachBtn = document.getElementById('attach-btn');
    const attachInput = document.getElementById('attach-input');
    const attachmentChip = document.getElementById('attachment-chip');
    const attachmentNameEl = document.getElementById('attachment-name');
    const removeAttachmentBtn = document.getElementById('remove-attachment-btn');
    const chatNote = document.getElementById('chat-note');
    const hamburgerBtn = document.getElementById('hamburger-btn');
    const summarizeBtn = document.getElementById('summarize-btn');
    const sidebar = document.getElementById('sidebar');
    const sidebarOverlay = document.getElementById('sidebar-overlay');

    const SYSTEM_PROMPT = 'You are a helpful, concise assistant.';
    const PREFIX = 'chrome-chat:';
    const INDEX_KEY = PREFIX + 'index';
    const threadKey = (id) => PREFIX + 'thread:' + id;

    // Schema version for the INDEX specifically (not the per-thread message
    // arrays, which haven't changed shape yet -- this same pattern extends
    // to those too if that ever changes). v1 (implicit, never stamped) was a
    // bare array; v2 wraps it with a version tag so a future shape change
    // can be detected and migrated instead of silently misread or crashing.
    const SCHEMA_VERSION = 2;

    function loadIndex() {
      let raw;
      try { raw = JSON.parse(localStorage.getItem(INDEX_KEY)); } catch { return []; }
      if (raw == null) return [];
      if (Array.isArray(raw)) return raw; // v1, unversioned -- migrates transparently on the next saveIndex()
      if (Array.isArray(raw.threads)) return raw.threads; // v2 (or any future version using this same wrapper shape)
      return []; // unrecognized shape -- fail safe rather than crash
    }
    function saveIndex(list) { localStorage.setItem(INDEX_KEY, JSON.stringify({ version: SCHEMA_VERSION, threads: list })); }
    function loadThreadMessages(id) { try { return JSON.parse(localStorage.getItem(threadKey(id))) || []; } catch { return []; } }
    function saveThreadMessages(id, msgs) { localStorage.setItem(threadKey(id), JSON.stringify(msgs)); }
    // Attachments (images/audio) are binary and can genuinely get large --
    // localStorage is text-only with a small quota, so they live in their own
    // IndexedDB store instead, referenced from a message by attachmentId
    // rather than embedding the blob directly. Everything else (threads,
    // messages, the index) stays in localStorage untouched -- this is a
    // narrow, additive change, not a storage-layer rewrite.
    const BLOB_DB_NAME = 'chrome-chat-attachments';
    const BLOB_STORE_NAME = 'blobs';
    let blobDbPromise = null;
    function openBlobDb() {
      if (!blobDbPromise) {
        blobDbPromise = new Promise((resolve, reject) => {
          const req = indexedDB.open(BLOB_DB_NAME, 1);
          req.onupgradeneeded = () => req.result.createObjectStore(BLOB_STORE_NAME, { keyPath: 'id' });
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        });
      }
      return blobDbPromise;
    }
    async function putBlob(blob) {
      const db = await openBlobDb();
      const id = crypto.randomUUID();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(BLOB_STORE_NAME, 'readwrite');
        tx.objectStore(BLOB_STORE_NAME).put({ id, blob });
        tx.oncomplete = () => resolve(id);
        tx.onerror = () => reject(tx.error);
      });
    }
    async function getBlob(id) {
      const db = await openBlobDb();
      return new Promise((resolve, reject) => {
        const req = db.transaction(BLOB_STORE_NAME, 'readonly').objectStore(BLOB_STORE_NAME).get(id);
        req.onsuccess = () => resolve(req.result ? req.result.blob : undefined);
        req.onerror = () => reject(req.error);
      });
    }
    async function deleteBlob(id) {
      const db = await openBlobDb();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(BLOB_STORE_NAME, 'readwrite');
        tx.objectStore(BLOB_STORE_NAME).delete(id);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    // For every message with a durable attachmentId but no live attachmentUrl
    // yet (just restored from storage this page load), fetch its real blob
    // and mint a fresh object URL so renderAttachmentHtml shows the actual
    // image/audio again instead of the "not saved" marker. Failures (missing
    // blob, IndexedDB error) are left to fall back to that marker rather than
    // thrown -- an honest "this one's gone" beats a broken page.
    async function hydrateAttachments(msgs) {
      await Promise.all(msgs.filter((m) => m.attachmentId && !m.attachmentUrl).map(async (m) => {
        try {
          const blob = await getBlob(m.attachmentId);
          if (blob) m.attachmentUrl = URL.createObjectURL(blob);
        } catch { /* leave unset -- renders as the disclosed fallback marker */ }
      }));
    }

    // Deletes any attachment blobs that belonged only to this thread. A fork
    // shares its pre-fork messages (and their attachmentIds) with the thread
    // it was forked from, so a blob is only actually safe to delete once no
    // *surviving* thread's messages still reference it.
    async function cleanupOrphanedAttachments(removedMsgs, remainingIndex) {
      const removedIds = removedMsgs.filter((m) => m.attachmentId).map((m) => m.attachmentId);
      if (!removedIds.length) return;
      const stillReferenced = new Set();
      for (const t of remainingIndex) {
        for (const m of loadThreadMessages(t.id)) {
          if (m.attachmentId) stillReferenced.add(m.attachmentId);
        }
      }
      await Promise.all(
        removedIds.filter((id) => !stillReferenced.has(id)).map((id) => deleteBlob(id).catch(() => {}))
      );
    }

    function deleteThread(id) {
      // If this thread has a live, still-streaming conversation, stop it
      // first -- otherwise its eventual completion would call
      // persistThread(id) again and silently resurrect the very thread just
      // deleted. Also drops it from the idle LRU cache if it happened to be
      // sitting there warm, so a stale entry doesn't linger.
      const conv = conversations.get(id);
      if (conv && conv.abortController) conv.abortController.abort();
      destroyAndDropConv(id);
      const msgs = loadThreadMessages(id);
      localStorage.removeItem(threadKey(id));
      const remainingIndex = loadIndex().filter((t) => t.id !== id);
      saveIndex(remainingIndex);
      cleanupOrphanedAttachments(msgs, remainingIndex);
    }

    function withTimeout(promise, ms) {
      return Promise.race([promise, new Promise((_, reject) => setTimeout(() => reject(new Error('timed out')), ms))]);
    }

    let promptOk = false;
    // Each conversation gets its own isolated slot -- {messages, session,
    // streaming, abortController, forkMeta} -- keyed by thread id, instead of
    // one shared set of globals. This is what makes it safe to switch away
    // from a thread while it's still generating a reply: switching only
    // changes which slot is DISPLAYED (activeThreadId); it never touches
    // another slot's live session or in-flight generation. A slot is created
    // the moment a thread's first message is actually sent, or the moment an
    // existing saved thread is opened, and is dropped again once you
    // navigate away from it PROVIDED it isn't still streaming -- an
    // in-flight reply keeps its slot alive and keeps running (and will still
    // save correctly) even after you've switched to something else. Fixes a
    // real, reproduced bug: previously a single shared `messages`/
    // `activeThreadId` meant switching threads mid-reply could silently lose
    // the in-flight exchange, or even mint a stray thread id that hijacked
    // whatever the *new* thread was about to save under.
    const conversations = new Map();
    const EMPTY_CONV = { messages: [], session: null, streaming: false, abortController: null };
    let activeThreadId = null; // which conversation is CURRENTLY DISPLAYED; null = a blank, not-yet-sent new chat
    function activeConv() { return conversations.get(activeThreadId) || EMPTY_CONV; }
    // Gemini Nano is one shared on-device model per machine -- separate
    // session objects don't mean separate compute, so a second conversation
    // generating while another already is will likely just wait its turn
    // rather than truly run in parallel. This can't speed that up (it's a
    // platform constraint, not something this app controls), but it's used
    // to make the wait honest instead of looking indistinguishable from
    // being stuck.
    function anyOtherConvStreaming(exceptId) {
      for (const [id, c] of conversations) {
        if (id !== exceptId && c.streaming) return true;
      }
      return false;
    }
    // Reopening an idle thread means recreating its session and re-feeding
    // its entire saved history via initialPrompts -- a real, noticeable
    // pause that scales with how much text is in that conversation. Keeping
    // the last few idle threads' sessions warm instead of destroying them
    // immediately avoids paying that cost every single time someone bounces
    // between a couple of active conversations, which is the common case.
    // Bounded (not "keep everything forever") to avoid unboundedly
    // accumulating live sessions over a long browsing session -- oldest
    // cached-idle thread is evicted once the cap is exceeded. Ordered
    // oldest-first; a thread is moved to the newest end every time it goes
    // idle, so this reflects recency of use, not just insertion order.
    const MAX_IDLE_CACHED = 3;
    const idleLruIds = [];
    function touchIdleLru(id) {
      const idx = idleLruIds.indexOf(id);
      if (idx !== -1) idleLruIds.splice(idx, 1);
      idleLruIds.push(id);
    }
    function removeFromIdleLru(id) {
      const idx = idleLruIds.indexOf(id);
      if (idx !== -1) idleLruIds.splice(idx, 1);
    }
    function destroyAndDropConv(id) {
      const conv = conversations.get(id);
      if (conv) {
        if (conv.session) { try { conv.session.destroy(); } catch {} }
        conversations.delete(id);
      }
      removeFromIdleLru(id);
    }

    // Called before switching the DISPLAYED thread away from prevId. An
    // actively-streaming conversation is left alone entirely (not cached,
    // not destroyed) so it keeps generating and saves correctly once it
    // finishes, even though it's no longer what's on screen. An idle one is
    // cached in the idle LRU instead of destroyed outright -- only evicted
    // once the cache is over MAX_IDLE_CACHED, oldest first.
    function leaveThread(prevId) {
      if (prevId == null) return;
      const conv = conversations.get(prevId);
      if (!conv || conv.streaming) return;
      touchIdleLru(prevId);
      while (idleLruIds.length > MAX_IDLE_CACHED) {
        const evictId = idleLruIds.shift();
        const evictConv = conversations.get(evictId);
        if (evictConv && !evictConv.streaming) {
          if (evictConv.session) { try { evictConv.session.destroy(); } catch {} }
          conversations.delete(evictId);
        }
      }
    }
    let editingIndex = null; // index of the user message currently being edited inline, or null
    const summarizingThreadIds = new Set(); // thread ids with a manual summarize/retitle request currently in flight
    let renamingId = null; // thread id currently showing an inline rename input, or null
    let pendingDeleteId = null; // thread id armed for delete on a second click, or null
    let pendingDeleteTimer = null;
    let searchQuery = '';
    let expandedFamilyRoot = null; // root id of the currently-expanded fork family in the sidebar, or null
    let pendingAttachment = null; // { file: File, type: 'image'|'audio' } queued for the next send, or null

    let modelAvailability = null; // the raw availability() string, kept around so prewarming/landing messaging can reuse it instead of re-querying
    async function checkCapability() {
      if (!self.LanguageModel) {
        statusPill.className = 'status-pill missing';
        statusPill.textContent = 'not in this browser';
        return;
      }
      try {
        const availability = await withTimeout(LanguageModel.availability(), 5000);
        modelAvailability = availability;
        promptOk = availability !== 'unavailable';
        statusPill.className = 'status-pill ' + (availability === 'available' ? 'available' : availability === 'unavailable' ? 'unavailable' : 'downloadable');
        statusPill.textContent = availability === 'downloadable' ? 'needs download' : availability;
      } catch (e) {
        statusPill.className = 'status-pill unavailable';
        statusPill.textContent = 'error: ' + e.message;
      }
      if (promptOk) chatSendBtn.disabled = false;
      else chatNote.textContent = 'The Prompt API isn\'t available in this browser right now.';
      maybePrewarmSession();
    }
    checkCapability();

    // Pre-warming: a brand-new chat's landing screen is genuine dead time --
    // nothing else is happening while the visitor reads/types -- so if the
    // model is already known to be available (no download needed), start
    // creating its session right then instead of waiting until they hit
    // send. Deliberately does NOT do this when a download would be needed:
    // that would silently start a real, possibly large download before the
    // visitor has done anything to ask for it, which is exactly the kind of
    // surprise this app is built to avoid (see the landing-screen warning
    // this pairs with, in checkLandingDownloadNotice).
    let prewarm = null; // { promise: Promise<{session, createMs}> } | null -- unclaimed, for whatever the NEXT brand-new chat turns out to be
    function maybePrewarmSession() {
      if (activeThreadId !== null || prewarm) return;
      checkLandingDownloadNotice();
      if (modelAvailability !== 'available') return;
      const startedAt = performance.now();
      const promise = LanguageModel.create({
        initialPrompts: [{ role: 'system', content: SYSTEM_PROMPT }],
        expectedInputs: [{ type: 'text' }, { type: 'image' }, { type: 'audio' }],
      }).then((session) => ({ session, createMs: Math.round(performance.now() - startedAt) }));
      prewarm = { promise };
      promise.catch(() => { prewarm = null; }); // failed -- sendText's own fallback path will just create fresh at send time
    }
    // A pre-warmed session belongs to whichever brand-new chat gets sent
    // next -- if the visitor instead opens a real, different thread, it's
    // no longer useful and would just sit there unreferenced. Destroyed
    // rather than left to leak.
    function discardPrewarmIfAny() {
      if (!prewarm) return;
      const claimed = prewarm;
      prewarm = null;
      claimed.promise.then(({ session }) => { try { session.destroy(); } catch {} }).catch(() => {});
    }
    // Honest, upfront warning on the landing screen itself when the model
    // would need a real download -- discovered only after clicking send
    // otherwise. Only touches the note while genuinely still landing (blank,
    // nothing sent yet); a later real send/thread-open overwrites chatNote
    // with its own more specific text regardless.
    function checkLandingDownloadNotice() {
      if (activeThreadId !== null) return;
      if (modelAvailability && modelAvailability !== 'available' && modelAvailability !== 'unavailable') {
        chatNote.textContent = 'The on-device model needs to download before first use — sending a message will start that, which may take a while.';
      }
    }

    function escapeHtml(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
    function renderMarkdown(text) { return '<div class="md">' + marked.parse(escapeHtml(text)) + '</div>'; }
    function formatDuration(ms) { return (ms / 1000).toFixed(1) + 's'; }

    let stickToBottom = true;

    // Copy/Regenerate only make sense on a finished assistant reply -- the
    // last message while a stream is still in flight is still growing, so
    // it's excluded. Edit and Regenerate are further restricted to only the
    // *last* exchange, since editing/regenerating anything earlier would
    // need to discard everything after it anyway (handled by the truncation
    // in editMessage/regenerateFrom) -- showing the action only where it's
    // actually reachable avoids a button that looks available but silently
    // deletes a bunch of later conversation when clicked.
    // The real blob is durable, stored in IndexedDB and referenced by
    // attachmentId (see putBlob/getBlob above); attachmentUrl is just an
    // in-memory display cache -- an object URL only ever valid for this page
    // load, never persisted (persistThread strips it). A freshly sent
    // message gets its attachmentUrl immediately in sendText; a restored one
    // gets it asynchronously via hydrateAttachments before its first render.
    // attachmentUrl is only ever created ONCE per message and reused on every
    // re-render (not regenerated here) -- renderChat() rebuilds every row
    // from scratch on every streamed chunk of a reply, so minting a fresh
    // blob URL in here would recreate it many times a second, forcing the
    // browser to redecode the image from scratch each time and visibly
    // flicker/reflow while the *next* message streams in below it.
    function renderAttachmentHtml(m) {
      if (m.attachmentUrl) {
        return m.attachmentType === 'image'
          ? '<img class="msg-attachment-img" src="' + m.attachmentUrl + '" alt="Attached image">'
          : '<audio class="msg-attachment-audio" controls src="' + m.attachmentUrl + '"></audio>';
      }
      if (m.attachmentType) {
        return '<div class="msg-attachment-missing">📎 ' + m.attachmentType + ' attached (unavailable)</div>';
      }
      return '';
    }

    function renderChat() {
      const conv = activeConv();
      const msgs = conv.messages;
      const isStreaming = conv.streaming;
      const hasMessages = msgs.length > 0;
      emptyStateEl.style.display = hasMessages ? 'none' : 'flex';
      // A brand-new, not-yet-sent chat shows its composer centered with the
      // greeting rather than docked at the bottom -- flips to the normal
      // docked layout the instant the first message renders.
      chatArea.classList.toggle('landing', !hasMessages);
      updateSummarizeBtn();
      chatLog.querySelectorAll('.message-row').forEach((el) => el.remove());
      const lastIndex = msgs.length - 1;
      msgs.forEach((m, i) => {
        const row = document.createElement('div');
        row.className = 'message-row ' + m.role;
        if (m.role === 'user') {
          if (i === editingIndex) {
            // Editing an earlier message inherently discards everything
            // after it (sequential conversation context can't fork), so
            // when this isn't the last message, say exactly how much would
            // go before it's actually committed -- no silent surprise.
            const discardCount = lastIndex - i;
            const warning = discardCount > 0
              ? '<div class="edit-warning">Saving will also remove the ' + discardCount + ' message' + (discardCount === 1 ? '' : 's') + ' after this one.</div>'
              : '';
            row.innerHTML = '<div class="content"><div class="user-wrap edit-mode">' +
              '<textarea class="edit-textarea" data-i="' + i + '">' + escapeHtml(m.content) + '</textarea>' +
              warning +
              '<div class="msg-actions">' +
                '<button class="icon-btn cancel-edit-btn" data-i="' + i + '">Cancel</button>' +
                '<button class="icon-btn fork-edit-btn" data-i="' + i + '" title="Keep the original conversation untouched; continue this edit as a new one">Fork</button>' +
                '<button class="icon-btn save-edit-btn" data-i="' + i + '">Save &amp; submit</button>' +
              '</div></div></div>';
          } else {
            // Any user message can be edited -- only gated on nothing else
            // already being edited and no generation in progress. Entering
            // edit mode is free and fully reversible (see startEdit/
            // cancelEdit), so there's no need to restrict *which* message
            // can be opened; the discard warning above is what protects
            // against a surprise when actually confirming one.
            const editBtn = (!isStreaming && editingIndex === null)
              ? '<div class="msg-actions"><button class="icon-btn edit-btn" data-i="' + i + '">Edit</button></div>' : '';
            row.innerHTML = '<div class="content"><div class="user-wrap"><div class="bubble">' + renderAttachmentHtml(m) + renderMarkdown(m.content) + '</div>' + editBtn + '</div></div>';
          }
        } else {
          const isLastAndStreaming = isStreaming && i === lastIndex;
          let actions = '';
          if (!isLastAndStreaming) {
            actions = '<div class="msg-actions"><button class="icon-btn copy-btn" data-i="' + i + '">Copy</button>';
            if (i === lastIndex && !isStreaming) {
              actions += '<button class="icon-btn regen-btn" data-i="' + i + '">Regenerate</button>';
            }
            actions += '</div>';
          }
          const sessionPart = m.timingMs && m.timingMs.session
            ? (m.timingMs.session.prewarmed
                ? ' · session was ready (warmed in background, ' + formatDuration(m.timingMs.session.createMs) + ')'
                : ' · ' + formatDuration(m.timingMs.session.createMs) + ' to start session')
            : '';
          const timingHtml = m.timingMs
            ? '<div class="msg-timing">' +
                (m.timingMs.firstChunk != null ? formatDuration(m.timingMs.firstChunk) + ' to first token · ' : '') +
                formatDuration(m.timingMs.total) + ' total' +
                (m.timingMs.wasQueued ? ' (queued behind another reply)' : '') +
                sessionPart +
              '</div>'
            : '';
          row.innerHTML = '<div class="content">' + renderMarkdown(m.content) + timingHtml + actions + '</div>';
        }
        chatLog.appendChild(row);
      });
      if (editingIndex !== null) {
        const ta = chatLog.querySelector('.edit-textarea[data-i="' + editingIndex + '"]');
        if (ta) {
          ta.style.height = 'auto';
          ta.style.height = ta.scrollHeight + 'px';
          ta.focus();
          ta.setSelectionRange(ta.value.length, ta.value.length);
        }
      }
      if (stickToBottom) {
        chatLog.scrollTop = chatLog.scrollHeight;
        scrollBottomBtn.style.display = 'none';
      }
    }
    chatLog.addEventListener('scroll', () => {
      stickToBottom = chatLog.scrollHeight - chatLog.scrollTop - chatLog.clientHeight < 40;
      scrollBottomBtn.style.display = stickToBottom ? 'none' : 'flex';
    });
    scrollBottomBtn.addEventListener('click', () => {
      stickToBottom = true;
      chatLog.scrollTop = chatLog.scrollHeight;
      scrollBottomBtn.style.display = 'none';
    });
    chatLog.addEventListener('click', async (e) => {
      const copyBtn = e.target.closest('.copy-btn');
      if (copyBtn) {
        const i = Number(copyBtn.dataset.i);
        await navigator.clipboard.writeText(activeConv().messages[i].content);
        const original = copyBtn.textContent;
        copyBtn.textContent = 'Copied';
        setTimeout(() => { copyBtn.textContent = original; }, 1500);
        return;
      }
      const editBtn = e.target.closest('.edit-btn');
      if (editBtn) { startEdit(Number(editBtn.dataset.i)); return; }
      const cancelEditBtn = e.target.closest('.cancel-edit-btn');
      if (cancelEditBtn) { cancelEdit(); return; }
      const saveEditBtn = e.target.closest('.save-edit-btn');
      if (saveEditBtn) {
        const i = Number(saveEditBtn.dataset.i);
        const textarea = chatLog.querySelector('.edit-textarea[data-i="' + i + '"]');
        await confirmEdit(i, textarea.value);
        return;
      }
      const forkEditBtn = e.target.closest('.fork-edit-btn');
      if (forkEditBtn) {
        const i = Number(forkEditBtn.dataset.i);
        const textarea = chatLog.querySelector('.edit-textarea[data-i="' + i + '"]');
        await forkFrom(i, textarea.value);
        return;
      }
      const regenBtn = e.target.closest('.regen-btn');
      if (regenBtn) { regenerateFrom(Number(regenBtn.dataset.i)); return; }
    });
    chatLog.addEventListener('input', (e) => {
      if (!e.target.matches('.edit-textarea')) return;
      e.target.style.height = 'auto';
      e.target.style.height = e.target.scrollHeight + 'px';
    });
    chatLog.addEventListener('keydown', async (e) => {
      if (!e.target.matches('.edit-textarea')) return;
      const i = Number(e.target.dataset.i);
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        await confirmEdit(i, e.target.value);
      } else if (e.key === 'Escape') {
        e.preventDefault();
        cancelEdit();
      }
    });

    // Full-content search, not just titles -- titles are only the first ~40
    // characters of a thread's first message, so title-only search would
    // miss most of what a conversation actually contains.
    function threadMatchesQuery(t, query) {
      if (!query) return true;
      const q = query.toLowerCase();
      if (t.title.toLowerCase().includes(q)) return true;
      return loadThreadMessages(t.id).some((m) => m.content.toLowerCase().includes(q));
    }

    function countForksOf(id) {
      return loadIndex().filter((t) => t.forkedFrom === id).length;
    }

    function formatRelativeTime(ts) {
      const mins = Math.round((Date.now() - ts) / 60000);
      if (mins < 1) return 'just now';
      if (mins < 60) return mins + 'm ago';
      const hours = Math.round(mins / 60);
      if (hours < 24) return hours + 'h ago';
      return Math.round(hours / 24) + 'd ago';
    }

    // Shared by a standalone (never-forked) thread and by each row inside an
    // expanded fork family -- same markup, same rename/delete affordances,
    // just an extra class when nested so it can be styled/indented.
    function renderThreadItemRow(t, indented) {
      const titleHtml = t.id === renamingId
        ? '<input class="thread-rename-input" data-id="' + t.id + '" value="' + escapeHtml(t.title) + '">'
        : '<span class="thread-title">' + escapeHtml(t.title) + '</span>';
      const deleteLabel = t.id === pendingDeleteId ? 'Sure?' : '×';
      // A background conversation (not the one currently displayed) that's
      // still streaming gets a small live indicator -- otherwise switching
      // away from an in-flight reply would look identical to it having been
      // lost, even though it's now genuinely still generating and will save
      // correctly once it finishes.
      const bgConv = conversations.get(t.id);
      const generatingHtml = (bgConv && bgConv.streaming && t.id !== activeThreadId)
        ? '<span class="thread-generating" title="Still generating a reply">●</span>' : '';
      const row = '<div class="thread-item ' + (indented ? 'family-child ' : '') + (t.id === activeThreadId ? 'active' : '') + '" data-id="' + t.id + '">' +
        titleHtml + generatingHtml +
        (t.id === renamingId ? '' : '<button class="thread-rename" data-id="' + t.id + '" title="Rename">✎</button>') +
        '<button class="thread-delete ' + (t.id === pendingDeleteId ? 'confirming' : '') + '" data-id="' + t.id + '" title="Delete">' + deleteLabel + '</button>' +
      '</div>';
      // Disclosed, not blocked -- deleting a thread other conversations were
      // forked from is allowed, but the confirm state says so plainly first.
      // Orphaned children keep their forkedFrom pointing at a now-missing
      // id; renderThreadList()'s family-label fallback already handles that
      // gracefully rather than crashing.
      if (t.id === pendingDeleteId) {
        const forkCount = countForksOf(t.id);
        if (forkCount > 0) {
          return row + '<div class="delete-fork-warning">Has ' + forkCount + ' fork' + (forkCount === 1 ? '' : 's') +
            ' -- ' + (forkCount === 1 ? 'it' : 'they') + ' will be kept, shown as forked from a deleted conversation.</div>';
        }
      }
      return row;
    }

    function renderThreadList() {
      const allThreads = loadIndex().sort((a, b) => b.updatedAt - a.updatedAt);
      const threads = allThreads.filter((t) => threadMatchesQuery(t, searchQuery));
      if (threads.length) {
        // Group by fork family: everyone sharing the same forkRoot (or, for
        // a never-forked thread, its own id). No member is auto-selected as
        // "primary" -- lineage is fixed, but which one you're shown is a
        // deliberate, neutral choice via the expand/pick UI below, not a
        // recency-derived default.
        const families = new Map();
        threads.forEach((t) => {
          const rootId = t.forkRoot || t.id;
          if (!families.has(rootId)) families.set(rootId, []);
          families.get(rootId).push(t);
        });
        const familyGroups = Array.from(families.entries());
        // Ordered by each family's most-recently-updated member -- a scan
        // order for the sidebar, not a selection of which member is "main".
        familyGroups.sort((a, b) => Math.max(...b[1].map((t) => t.updatedAt)) - Math.max(...a[1].map((t) => t.updatedAt)));

        threadListEl.innerHTML = familyGroups.map(([rootId, members]) => {
          if (members.length === 1) return renderThreadItemRow(members[0], false);

          const rootMember = members.find((m) => m.id === rootId);
          // Falls back gracefully if the root itself was deleted or filtered
          // out by an active search -- never crashes on a missing root.
          const label = rootMember ? rootMember.title : members[0].title + ' (original not shown)';
          const isExpanded = expandedFamilyRoot === rootId;
          const hasActiveMember = members.some((m) => m.id === activeThreadId);
          const childrenHtml = isExpanded
            ? '<div class="family-children">' + members.map((m) => (
                '<div class="family-child-wrap">' +
                  renderThreadItemRow(m, true) +
                  '<div class="family-child-meta">' + (m.id === rootId ? 'Original' : 'Fork') + ' · ' + formatRelativeTime(m.updatedAt) + '</div>' +
                '</div>'
              )).join('') + '</div>'
            : '';
          return '<div class="family-row ' + (hasActiveMember ? 'active' : '') + '" data-root-id="' + rootId + '">' +
            '<span class="family-chevron">' + (isExpanded ? '▾' : '▸') + '</span>' +
            '<span class="thread-title">' + escapeHtml(label) + '</span>' +
            '<span class="family-count">' + members.length + '</span>' +
          '</div>' + childrenHtml;
        }).join('');
        if (renamingId !== null) {
          const input = threadListEl.querySelector('.thread-rename-input');
          if (input) { input.focus(); input.select(); }
        }
      } else {
        threadListEl.innerHTML = '<div class="empty-hint">' +
          (allThreads.length ? 'No conversations match your search.' : 'No saved conversations yet.') +
          '</div>';
      }
    }
    renderThreadList();
    renderChat(); // establishes the correct initial layout (landing vs docked) on a fresh page load

    // Persists a SPECIFIC thread by id, reading its own conversation slot --
    // never the currently-displayed one. This is the other half of the
    // background-generation fix: a reply always saves to the thread it
    // actually belongs to, regardless of whatever the visitor has since
    // switched to. Called once immediately when the user's own message is
    // sent (so it's never lost even if the reply is interrupted) and again
    // once the reply finishes.
    function persistThread(threadId) {
      const conv = conversations.get(threadId);
      if (!conv) return; // deleted (see deleteThread) while this was in flight -- nothing to save
      const index = loadIndex();
      const existing = index.find((t) => t.id === threadId);
      const title = existing ? existing.title : titleFrom(conv.messages[0]?.content || 'New chat');
      const updated = index.filter((t) => t.id !== threadId);
      const entry = { id: threadId, title, updatedAt: Date.now() };
      // Lineage fields, once set, must survive every later save of this same
      // thread -- this rebuilds the whole index entry from scratch each
      // time, so without this they'd silently vanish after the fork's very
      // first message.
      if (!existing && conv.forkMeta) {
        entry.forkedFrom = conv.forkMeta.forkedFrom;
        entry.forkRoot = conv.forkMeta.forkRoot;
      } else if (existing && existing.forkedFrom) {
        entry.forkedFrom = existing.forkedFrom;
        entry.forkRoot = existing.forkRoot;
      }
      updated.push(entry);
      saveIndex(updated);
      // Strip the blob URL before persisting -- it's a plain string so it
      // WOULD serialize "successfully", but blob URLs don't survive a reload
      // (the page that created them is gone), so a saved one would just be a
      // dead reference producing a broken image rather than the honest
      // "not saved across reloads" marker. The in-memory `messages` array
      // keeps the real attachmentUrl for as long as this page stays loaded;
      // only the saved copy drops it. timingMs is dropped too -- it's a
      // quick diagnostic for this page load only, not meant to be a
      // permanent saved record.
      const storableMessages = conv.messages.map((m) => {
        if (!m.attachmentUrl && !m.timingMs) return m;
        const { attachmentUrl, timingMs, ...rest } = m;
        return rest;
      });
      saveThreadMessages(threadId, storableMessages);
      renderThreadList();
    }

    function titleFrom(text) {
      const t = text.trim().replace(/\s+/g, ' ');
      return t.length > 40 ? t.slice(0, 40) + '…' : t;
    }

    const TITLE_SYSTEM_PROMPT = 'You write extremely short conversation titles. Given the user\'s message, reply with ONLY a title of 3-6 words -- no quotes, no trailing punctuation, no explanation, nothing else.';
    // A real, separate model call -- not the truncated first-N-characters
    // titleFrom() gives you. Uses its own throwaway session (distinct system
    // prompt, destroyed right after) rather than the real conversational
    // session, so it never pollutes that session's actual context.
    async function generateTitle(text) {
      const session = await LanguageModel.create({ initialPrompts: [{ role: 'system', content: TITLE_SYSTEM_PROMPT }] });
      try {
        const raw = await session.prompt(text);
        const cleaned = raw.trim().replace(/^["'“”]+|["'“”]+$/g, '').replace(/[.!?]+$/, '').trim();
        return cleaned || titleFrom(text);
      } finally {
        try { session.destroy(); } catch {}
      }
    }
    // Fire-and-forget: replaces a thread's fallback (truncated) title with a
    // real generated one once ready. Deliberately never awaited by its
    // caller -- the reply the visitor is actually looking at must never
    // wait on this. Only ever called for a thread's first exchange, and
    // sequenced strictly AFTER that reply already finished (see
    // streamReply) -- Gemini Nano is one shared on-device resource, so
    // running this concurrently with the actual reply would just make both
    // slower for no benefit the visitor asked for; running it after means
    // it can only ever compete with something ELSE sent afterward, not with
    // the reply someone is actually staring at.
    async function maybeGenerateTitle(threadId, firstUserText) {
      if (!firstUserText) return; // e.g. an image-only first message with no text -- keep the fallback title
      let title;
      try {
        title = await generateTitle(firstUserText);
      } catch {
        return; // model call failed -- keep whatever fallback title is already saved
      }
      const idx = loadIndex();
      const entry = idx.find((t) => t.id === threadId);
      if (!entry) return; // thread deleted while this was generating
      entry.title = title;
      saveIndex(idx);
      renderThreadList();
    }

    // Manual, on-demand alternative to the silent one-shot title above --
    // reads the WHOLE conversation so far (not just the first message) and
    // produces both a refreshed title and a short summary, stored as plain
    // metadata on the thread's index entry. Unlike generateTitle, this is
    // user-triggered (a button, not fire-and-forget) so it's fine to show
    // real loading state and block re-clicking while it's in flight.
    const SUMMARY_SYSTEM_PROMPT = 'You read a conversation transcript and produce a short title and a brief summary for it. Given the transcript below, respond in EXACTLY this format and nothing else:\nTITLE: <a 3-6 word title>\nSUMMARY: <a 2-3 sentence summary of what was discussed>';
    function transcriptFor(messages) {
      return messages.map((m) => (m.role === 'user' ? 'User: ' : 'Assistant: ') + m.content).join('\n\n');
    }
    async function generateSummaryAndTitle(transcriptText) {
      const session = await LanguageModel.create({ initialPrompts: [{ role: 'system', content: SUMMARY_SYSTEM_PROMPT }] });
      try {
        const raw = await session.prompt(transcriptText);
        const titleMatch = raw.match(/TITLE:\s*(.+)/i);
        const summaryMatch = raw.match(/SUMMARY:\s*([\s\S]+)/i);
        const title = titleMatch ? titleMatch[1].trim().replace(/^["'“”]+|["'“”]+$/g, '').replace(/[.!?]+$/, '') : null;
        const summary = summaryMatch ? summaryMatch[1].trim() : null;
        return { title, summary };
      } finally {
        try { session.destroy(); } catch {}
      }
    }
    // Keeps the button's label/enabled state/tooltip in sync with whatever
    // thread is currently displayed. Deliberately skips the localStorage
    // lookup for the tooltip text while hidden or mid-stream -- this runs
    // from inside renderChat(), which itself fires on every streamed chunk,
    // so that lookup would otherwise run many times a second for no reason.
    function updateSummarizeBtn() {
      const conv = activeConv();
      const hasContent = activeThreadId !== null && conv.messages.length > 0;
      const isSummarizing = summarizingThreadIds.has(activeThreadId);
      summarizeBtn.style.display = hasContent ? 'inline-flex' : 'none';
      summarizeBtn.disabled = conv.streaming || isSummarizing;
      summarizeBtn.textContent = isSummarizing ? 'Summarizing…' : 'Summarize';
      if (!hasContent || conv.streaming) return;
      const entry = loadIndex().find((t) => t.id === activeThreadId);
      summarizeBtn.title = entry && entry.summary ? entry.summary : 'Generate a summary and refresh this conversation\'s title';
    }
    async function summarizeThread(threadId) {
      const conv = conversations.get(threadId);
      if (!conv || conv.streaming || summarizingThreadIds.has(threadId)) return;
      summarizingThreadIds.add(threadId);
      updateSummarizeBtn();
      try {
        const { title, summary } = await generateSummaryAndTitle(transcriptFor(conv.messages));
        if (!title && !summary) throw new Error('could not read a title or summary from the response');
        const idx = loadIndex();
        const entry = idx.find((t) => t.id === threadId);
        if (entry) {
          if (title) entry.title = title;
          if (summary) entry.summary = summary;
          saveIndex(idx);
          renderThreadList();
        }
      } catch (e) {
        if (activeThreadId === threadId) chatNote.textContent = 'Could not generate a summary: ' + e.message;
      } finally {
        summarizingThreadIds.delete(threadId);
        updateSummarizeBtn();
      }
    }
    summarizeBtn.addEventListener('click', () => { if (activeThreadId !== null) summarizeThread(activeThreadId); });

    function closeSidebarMobile() {
      sidebar.classList.remove('open');
      sidebarOverlay.classList.remove('visible');
    }

    function startNewChat() {
      leaveThread(activeThreadId);
      activeThreadId = null;
      editingIndex = null;
      stickToBottom = true;
      chatSendBtn.style.display = 'flex';
      chatStopBtn.style.display = 'none';
      chatSendBtn.disabled = !promptOk; // a blank new chat has no session/streaming of its own to wait on
      renderChat();
      renderThreadList();
      chatNote.textContent = '';
      chatNote.classList.remove('warn');
      closeSidebarMobile();
      maybePrewarmSession(); // no-ops if one's already pending/warmed, or if a download would be needed
    }

    async function openThread(id) {
      if (id === activeThreadId) { closeSidebarMobile(); return; }
      leaveThread(activeThreadId);
      discardPrewarmIfAny(); // opening a real thread -- any pending "next new chat" prewarm is now moot
      activeThreadId = id;
      // It's the DISPLAYED thread now, not an idle cache entry -- must never
      // be a candidate for eviction while the visitor is actually looking at
      // it (a later leaveThread() call re-adds it once it's actually left).
      removeFromIdleLru(id);
      editingIndex = null;
      stickToBottom = true;
      // Reuse an already-live slot as-is (e.g. one still streaming in the
      // background, or one kept warm in the idle cache from a recent visit)
      // rather than reloading a possibly-stale snapshot over top of its
      // real, current in-memory state.
      let conv = conversations.get(id);
      if (!conv) {
        conv = { messages: loadThreadMessages(id), session: null, streaming: false, abortController: null, forkMeta: null };
        conversations.set(id, conv);
      }
      chatSendBtn.style.display = conv.streaming ? 'none' : 'flex';
      chatStopBtn.style.display = conv.streaming ? 'flex' : 'none';
      // Reset explicitly rather than leaving whatever the PREVIOUSLY
      // displayed thread happened to set -- Send's enabled state belongs to
      // this thread's own conv now, not whatever was shown a moment ago.
      if (!conv.streaming) chatSendBtn.disabled = !promptOk;
      renderChat();
      renderThreadList();
      // Fetching real attachment blobs from IndexedDB is async -- render the
      // text immediately (same as everywhere else in this app) rather than
      // blocking on it, then re-render once images/audio are ready. Guarded
      // by activeThreadId in case the visitor's already opened a different
      // thread by the time this resolves.
      hydrateAttachments(conv.messages).then(() => { if (activeThreadId === id) renderChat(); });
      closeSidebarMobile();
      if (!promptOk || conv.streaming) return; // already generating (or API unavailable) -- nothing more to set up
      if (conv.session) { chatSendBtn.disabled = false; return; } // already primed from an earlier visit this page load
      chatSendBtn.disabled = true;
      chatNote.textContent = 'Loading this conversation into the model…';
      try {
        conv.session = await LanguageModel.create({
          initialPrompts: [{ role: 'system', content: SYSTEM_PROMPT }, ...conv.messages.map((m) => ({ role: m.role, content: m.content }))],
          expectedInputs: [{ type: 'text' }, { type: 'image' }, { type: 'audio' }],
          // Same download-progress feedback sendText's session creation
          // already has -- without this, reopening a saved thread on a
          // device that hasn't downloaded the model yet just sat there
          // silently with no percentage, unlike sending a fresh message.
          monitor(m) {
            m.addEventListener('downloadprogress', (e) => {
              if (activeThreadId === id) chatNote.textContent = 'Downloading model… ' + Math.round(e.loaded * 100) + '%';
            });
          },
        });
        if (activeThreadId === id) { chatNote.textContent = ''; warnIfNearLimit(); }
      } catch (e) {
        if (activeThreadId === id) chatNote.textContent = 'Could not restore into the model: ' + e.message;
      }
      if (activeThreadId === id) chatSendBtn.disabled = false;
    }

    // Reads the session's own real contextUsage/contextWindow numbers rather
    // than estimating from message length -- warns before a visitor actually
    // hits a hard QuotaExceededError, not after. Only ever called for
    // whichever thread is currently displayed.
    function warnIfNearLimit() {
      const conv = activeConv();
      if (!conv.session || conv.session.contextUsage == null || conv.session.contextWindow == null) return;
      const ratio = conv.session.contextUsage / conv.session.contextWindow;
      if (ratio > 0.85) {
        chatNote.textContent = (chatNote.textContent ? chatNote.textContent + ' ' : '') +
          'This conversation is getting close to its context limit — consider starting a new chat soon.';
        chatNote.classList.add('warn');
      } else {
        chatNote.classList.remove('warn');
      }
    }

    newChatBtn.addEventListener('click', startNewChat);
    function renameThread(id, newTitle) {
      const title = newTitle.trim();
      if (!title) return; // an empty submit just cancels, same as Escape
      const index = loadIndex();
      const t = index.find((th) => th.id === id);
      if (t) { t.title = title; saveIndex(index); }
    }

    threadListEl.addEventListener('click', (e) => {
      const familyRow = e.target.closest('.family-row');
      if (familyRow) {
        const rootId = familyRow.dataset.rootId;
        expandedFamilyRoot = expandedFamilyRoot === rootId ? null : rootId;
        renderThreadList();
        return;
      }
      const delBtn = e.target.closest('.thread-delete');
      if (delBtn) {
        const id = delBtn.dataset.id;
        if (pendingDeleteId === id) {
          // Second click on the same delete button within the timeout --
          // actually delete now.
          clearTimeout(pendingDeleteTimer);
          pendingDeleteId = null;
          deleteThread(id);
          if (id === activeThreadId) startNewChat(); else renderThreadList();
        } else {
          // First click -- arm confirmation rather than deleting outright.
          // Auto-reverts after a few seconds so it doesn't stay in a
          // confusing "Sure?" state if the visitor walks away.
          pendingDeleteId = id;
          renderThreadList();
          clearTimeout(pendingDeleteTimer);
          pendingDeleteTimer = setTimeout(() => { pendingDeleteId = null; renderThreadList(); }, 3000);
        }
        return;
      }
      const renameBtn = e.target.closest('.thread-rename');
      if (renameBtn) {
        renamingId = renameBtn.dataset.id;
        renderThreadList();
        return;
      }
      if (e.target.closest('.thread-rename-input')) return; // let the input handle its own clicks/typing
      const item = e.target.closest('.thread-item');
      if (item) openThread(item.dataset.id);
    });
    threadListEl.addEventListener('keydown', (e) => {
      if (!e.target.matches('.thread-rename-input')) return;
      if (e.key === 'Enter') {
        e.preventDefault();
        renameThread(e.target.dataset.id, e.target.value);
        renamingId = null;
        renderThreadList();
      } else if (e.key === 'Escape') {
        e.preventDefault();
        renamingId = null;
        renderThreadList();
      }
    });
    threadListEl.addEventListener('blur', (e) => {
      if (!e.target.matches('.thread-rename-input') || renamingId === null) return;
      renameThread(e.target.dataset.id, e.target.value);
      renamingId = null;
      renderThreadList();
    }, true); // capture -- blur doesn't bubble

    threadSearchInput.addEventListener('input', () => {
      searchQuery = threadSearchInput.value;
      renderThreadList();
    });

    hamburgerBtn.addEventListener('click', () => {
      sidebar.classList.add('open');
      sidebarOverlay.classList.add('visible');
    });
    sidebarOverlay.addEventListener('click', closeSidebarMobile);
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSidebarMobile(); });

    function autoResize() {
      chatInput.style.height = 'auto';
      chatInput.style.height = chatInput.scrollHeight + 'px';
    }
    chatInput.addEventListener('input', autoResize);

    attachBtn.addEventListener('click', () => attachInput.click());
    attachInput.addEventListener('change', () => {
      const file = attachInput.files[0];
      if (!file) return;
      const type = file.type.startsWith('image/') ? 'image' : file.type.startsWith('audio/') ? 'audio' : null;
      if (!type) {
        chatNote.textContent = 'Only image or audio files can be attached.';
        attachInput.value = '';
        return;
      }
      pendingAttachment = { file, type };
      attachmentNameEl.textContent = file.name;
      attachmentChip.style.display = 'flex';
    });
    removeAttachmentBtn.addEventListener('click', () => {
      pendingAttachment = null;
      attachInput.value = '';
      attachmentChip.style.display = 'none';
    });

    // Shared by a fresh send, edit-and-resend, fork, and regenerate -- takes
    // the exact turn content to send plus the thread id it belongs to
    // (captured by the caller BEFORE this starts, never re-derived from
    // whatever's currently displayed). Owns the streaming loop and persists
    // the thread once the reply is done -- always to threadId's own slot,
    // so a reply that's still generating after the visitor switches away
    // completes correctly and saves to the right place instead of getting
    // lost or attributed to whatever's since become active.
    async function streamReply(threadId, turnInput, sessionTiming) {
      const conv = conversations.get(threadId);
      const isShown = () => activeThreadId === threadId;
      const assistantMsg = { role: 'assistant', content: '' };
      conv.messages.push(assistantMsg);
      conv.streaming = true;
      conv.abortController = new AbortController();
      const wasQueued = anyOtherConvStreaming(threadId);
      if (isShown()) {
        chatSendBtn.style.display = 'none';
        chatStopBtn.style.display = 'flex';
        if (wasQueued) chatNote.textContent = 'Waiting on another reply to finish generating first…';
        renderChat();
      }
      renderThreadList(); // reflects the new "generating" indicator even if this thread isn't displayed
      const startedAt = performance.now();
      let firstChunkAt = null;
      try {
        const stream = conv.session.promptStreaming(turnInput, { signal: conv.abortController.signal });
        for await (const chunk of stream) {
          if (firstChunkAt === null) {
            firstChunkAt = performance.now();
            // Real progress has actually started -- clear a stale "waiting"
            // note now rather than leaving it up for the rest of the reply.
            if (wasQueued && isShown()) chatNote.textContent = '';
          }
          assistantMsg.content += chunk;
          if (isShown()) renderChat();
        }
        if (isShown()) chatNote.textContent = '';
      } catch (e) {
        if (isShown()) chatNote.textContent = e.name === 'AbortError' ? 'Stopped.' : 'Error: ' + e.message;
      }
      conv.streaming = false;
      conv.abortController = null;
      // Quick, in-memory-only answer to "how long does this actually take" --
      // never persisted (see persistThread), easy to pull out later if it's
      // not worth keeping around.
      assistantMsg.timingMs = {
        total: Math.round(performance.now() - startedAt),
        firstChunk: firstChunkAt === null ? null : Math.round(firstChunkAt - startedAt),
        wasQueued, // true if another conversation was already generating when this one started
        session: sessionTiming || null, // set only on the message whose turn actually created/adopted the session
      };
      if (isShown()) {
        chatSendBtn.style.display = 'flex';
        chatStopBtn.style.display = 'none';
        renderChat(); // re-render once more so the finished (or stopped) reply gets its Copy button + timing
        warnIfNearLimit();
      }
      persistThread(threadId); // always -- this reply belongs to threadId regardless of what's currently displayed
      // First exchange only -- request a real generated title now that the
      // reply itself is fully done and displayed. Not awaited: this must
      // never delay anything the visitor is actually looking at.
      if (conv.messages.length === 2) {
        maybeGenerateTitle(threadId, conv.messages[0].content);
      }
    }

    chatStopBtn.addEventListener('click', () => {
      const conv = activeConv();
      if (conv.abortController) conv.abortController.abort();
    });

    // Given a message that's about to be dropped by a truncating slice()
    // (edit/fork/regenerate all do this), pulls out enough to carry its
    // attachment forward onto the replacement message sendText builds --
    // same attachmentId/url reused (not re-stored under a new id), plus the
    // real blob refetched from IndexedDB so the *model* actually sees the
    // image again too, not just the redisplayed transcript. Without this,
    // editing or regenerating a message that had an attachment would
    // silently drop it from both the visible conversation and the model's
    // context, and orphan its blob in IndexedDB with nothing left to
    // reference it (confirmed as a real, reproducible bug before this fix).
    async function carryAttachmentFrom(m) {
      if (!m.attachmentId) return null;
      let blob = null;
      try { blob = await getBlob(m.attachmentId); } catch { /* falls back to a text-only resend below */ }
      return { type: m.attachmentType, id: m.attachmentId, url: m.attachmentUrl, blob };
    }

    // Shared by a normal send, edit-and-resend, fork, and regenerate.
    // `attachment` is a fresh upload (mints a new stored blob + id); `carried`
    // is an existing attachment being carried forward onto the replacement
    // message (reuses its id/url, no duplicate blob stored) -- exactly one
    // of the two is ever passed, never both. `targetThreadId`, when given,
    // is the thread this turn continues (captured by the caller before any
    // of its own awaits, so it stays correct even if the visitor switches
    // threads in the meantime); when omitted, this is a normal composer send
    // -- continues whatever's currently active, or mints a brand-new,
    // stable thread id immediately if this is a genuinely new chat (rather
    // than lazily at the end of generation, which was the root cause of a
    // real, reproduced bug where switching threads mid-reply could corrupt
    // or lose data).
    async function sendText(text, attachment, carried, targetThreadId) {
      if ((!text && !attachment && !carried) || !promptOk) return;
      let threadId = targetThreadId;
      let claimedPrewarm = null;
      if (threadId == null) {
        if (activeThreadId === null) {
          threadId = crypto.randomUUID();
          activeThreadId = threadId;
          conversations.set(threadId, { messages: [], session: null, streaming: false, abortController: null, forkMeta: null });
          // If the landing screen already started warming a session for
          // "whatever comes next", this new thread is that -- claim it now
          // (synchronously, before any await) so no other code path can
          // also claim the same one.
          claimedPrewarm = prewarm;
          prewarm = null;
        } else {
          threadId = activeThreadId;
        }
      }
      const conv = conversations.get(threadId);
      const isShown = () => activeThreadId === threadId;
      if (isShown()) chatSendBtn.disabled = true;
      const userMsg = { role: 'user', content: text };
      let modelAttachment = null; // { type, file } actually sent to the model this turn
      if (attachment) {
        userMsg.attachmentType = attachment.type;
        userMsg.attachmentUrl = URL.createObjectURL(attachment.file);
        try { userMsg.attachmentId = await putBlob(attachment.file); }
        catch { /* real preview still works this session; just won't survive a reload */ }
        modelAttachment = attachment;
      } else if (carried) {
        userMsg.attachmentType = carried.type;
        userMsg.attachmentId = carried.id;
        userMsg.attachmentUrl = carried.url || (carried.blob && URL.createObjectURL(carried.blob));
        if (carried.blob) modelAttachment = { type: carried.type, file: carried.blob };
      }
      conv.messages.push(userMsg);
      // Persist the user's own message right away -- independent of whether
      // a reply ever finishes, or the visitor switches away before it does.
      // Fixes "doesn't save unless it runs through": that used to only ever
      // happen once, at the very end of the whole exchange.
      persistThread(threadId);
      if (isShown()) { stickToBottom = true; renderChat(); chatNote.textContent = 'Generating…'; }

      let sessionTiming = null; // only set if THIS call actually created/adopted the session -- not on a continuing turn that reuses an existing one
      try {
        if (!conv.session && claimedPrewarm) {
          try {
            const { session, createMs } = await claimedPrewarm.promise;
            conv.session = session;
            sessionTiming = { createMs, prewarmed: true };
          } catch { /* prewarm failed -- falls through to the normal path below */ }
        }
        if (!conv.session) {
          if (isShown()) chatNote.textContent = 'Starting session (may download the model on first use)…';
          const sessionStartedAt = performance.now();
          // conv.messages already includes the turn just pushed above -- seed
          // initialPrompts with everything BEFORE it. For a genuinely new
          // chat that's empty; after an edit/regenerate truncation it's the
          // real preserved history, so a freshly (re)created session doesn't
          // silently forget context that should still be there.
          conv.session = await LanguageModel.create({
            initialPrompts: [{ role: 'system', content: SYSTEM_PROMPT }, ...conv.messages.slice(0, -1).map((m) => ({ role: m.role, content: m.content }))],
            expectedInputs: [{ type: 'text' }, { type: 'image' }, { type: 'audio' }],
            monitor(m) {
              m.addEventListener('downloadprogress', (e) => {
                if (isShown()) chatNote.textContent = 'Downloading model… ' + Math.round(e.loaded * 100) + '%';
              });
            },
          });
          sessionTiming = { createMs: Math.round(performance.now() - sessionStartedAt), prewarmed: false };
        }
        const content = [];
        if (text) content.push({ type: 'text', value: text });
        if (modelAttachment) content.push({ type: modelAttachment.type, value: modelAttachment.file });
        await streamReply(threadId, [{ role: 'user', content }], sessionTiming);
      } catch (e) {
        if (isShown()) chatNote.textContent = 'Error: ' + e.message;
      }
      if (isShown()) chatSendBtn.disabled = false;
    }

    async function sendChat() {
      const text = chatInput.value.trim();
      const attachment = pendingAttachment;
      if ((!text && !attachment) || !promptOk) return;
      chatInput.value = '';
      autoResize();
      pendingAttachment = null;
      attachInput.value = '';
      attachmentChip.style.display = 'none';
      await sendText(text, attachment);
    }

    // Entering edit mode touches nothing but `editingIndex` -- messages,
    // the session, and everything else stay completely untouched until the
    // edit is actually confirmed. That's the whole fix for the earlier
    // behavior: clicking Edit used to truncate the conversation immediately,
    // with no way back if you changed your mind partway through.
    function startEdit(i) {
      if (activeConv().streaming || editingIndex !== null) return;
      editingIndex = i;
      renderChat();
    }

    // Cancel reverts the display back to the plain bubble -- nothing was
    // ever mutated, so there's nothing to restore.
    function cancelEdit() {
      editingIndex = null;
      renderChat();
    }

    async function confirmEdit(i, newText) {
      const text = newText.trim();
      editingIndex = null;
      if (!text) { renderChat(); return; } // an empty submit just reverts, same as Cancel
      // Captured up front, before the await below -- guarantees this keeps
      // operating on the thread actually being edited even if the visitor
      // somehow switches to a different one in the meantime.
      const threadId = activeThreadId;
      const conv = conversations.get(threadId);
      const carried = await carryAttachmentFrom(conv.messages[i]);
      // Only now -- with a real, confirmed replacement text in hand -- do we
      // actually truncate and destroy the session. A live session's internal
      // context can't be rewound, so it's recreated (with whatever prefix
      // remains) the next time sendText runs.
      conv.messages = conv.messages.slice(0, i);
      if (conv.session) { try { conv.session.destroy(); } catch {} conv.session = null; }
      if (activeThreadId === threadId) stickToBottom = true;
      await sendText(text, null, carried, threadId);
    }

    // Same truncation as confirmEdit, but the ORIGINAL thread's own slot is
    // left completely untouched (including its own live session, if it has
    // one) -- a brand-new thread id and slot are minted directly for the
    // fork instead, so there's no shared mutable state between the two.
    async function forkFrom(i, newText) {
      const text = newText.trim();
      editingIndex = null;
      if (!text) { renderChat(); return; }

      const originalThreadId = activeThreadId;
      const originalConv = conversations.get(originalThreadId);
      const carried = await carryAttachmentFrom(originalConv.messages[i]);
      const originalEntry = loadIndex().find((t) => t.id === originalThreadId);
      const forkRoot = (originalEntry && originalEntry.forkRoot) || originalThreadId;

      // The ORIGINAL conversation's slot is left completely untouched (its
      // own live session, if any, keeps running independently) -- only a
      // fresh, truncated copy of its messages becomes the new fork.
      const forkedMessages = originalConv.messages.slice(0, i);
      const forkThreadId = crypto.randomUUID();
      conversations.set(forkThreadId, {
        messages: forkedMessages, session: null, streaming: false, abortController: null,
        forkMeta: { forkedFrom: originalThreadId, forkRoot },
      });
      activeThreadId = forkThreadId;
      stickToBottom = true;
      await sendText(text, null, carried, forkThreadId);
    }

    async function regenerateFrom(assistantIndex) {
      const threadId = activeThreadId;
      const conv = conversations.get(threadId);
      if (!conv || conv.streaming || !conv.session) return;
      const lastUserIndex = assistantIndex - 1;
      if (lastUserIndex < 0 || conv.messages[lastUserIndex].role !== 'user') return;
      const textToResend = conv.messages[lastUserIndex].content;
      const carried = await carryAttachmentFrom(conv.messages[lastUserIndex]);
      // Same truncate-and-destroy path as editMessage, then immediately
      // resend the REAL prior text (not a filler string -- a real bug caught
      // in this exact spot during planning) plus its real attachment, if any
      // (a second real bug, caught by review after attachments shipped: this
      // used to resend text-only, silently dropping the image from both the
      // transcript and the model's context) so the visible transcript and
      // the model's actual context never diverge.
      conv.messages = conv.messages.slice(0, lastUserIndex);
      if (conv.session) { try { conv.session.destroy(); } catch {} conv.session = null; }
      if (activeThreadId === threadId) { stickToBottom = true; renderChat(); }
      await sendText(textToResend, null, carried, threadId);
    }

    chatSendBtn.addEventListener('click', sendChat);
    chatInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChat(); }
    });
  </script>
</body>
</html>
