<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>chrome-chat</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    line-height: 1.5;
  }
  input, button, textarea { font: inherit; }
  button { cursor: pointer; }

  :root {
    --bg: #ffffff;
    --fg: #111111;
    --muted: #6e6e80;
    --border: #e5e5e5;
    --accent: #0a58ca;
    --accent-fg: #ffffff;
    --user-bubble-bg: #f0f4ff;
    --ok: #1a7f37;
    --warn: #9a6700;
    --bad: #cf222e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #212121;
      --fg: #ececf1;
      --muted: #9b9b9b;
      --border: #3a3a3a;
      --accent: #6ea8fe;
      --accent-fg: #0d1117;
      --user-bubble-bg: #2f2f3a;
      --ok: #3fb950;
      --warn: #d29922;
      --bad: #ff7b72;
    }
  }

  #app {
    display: grid;
    grid-template-columns: 260px 1fr;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    background: var(--bg);
    color: var(--fg);
  }

  /* --- Sidebar: always-dark, independent of prefers-color-scheme --- */
  #sidebar {
    display: flex;
    flex-direction: column;
    height: 100%;
    background: #171717;
    color: #ececf1;
  }
  .sidebar-header { flex-shrink: 0; padding: 0.75rem; }
  #new-chat-btn {
    width: 100%;
    background: transparent;
    color: #ececf1;
    border: 1px solid #4d4d4d;
    border-radius: 8px;
    padding: 0.6rem 0.75rem;
    font-size: 0.9rem;
    text-align: left;
  }
  #new-chat-btn:hover { background: #2a2a2a; }
  #thread-list { flex: 1; min-height: 0; overflow-y: auto; padding: 0 0.5rem; }
  .thread-item {
    display: flex; align-items: center; gap: 0.4rem;
    padding: 0.6rem 0.6rem; border-radius: 6px; cursor: pointer; font-size: 0.85rem;
  }
  .thread-item:hover { background: #2a2a2a; }
  .thread-item.active { background: #343541; font-weight: 600; }
  .thread-item .thread-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .thread-item .thread-delete {
    background: transparent; color: #9b9b9b; border: none;
    padding: 0.1rem 0.4rem; font-size: 0.9rem; border-radius: 4px; flex-shrink: 0;
  }
  .thread-item .thread-delete:hover { background: #ff7b7222; color: #ff7b72; }
  .empty-hint { color: #9b9b9b; font-size: 0.8rem; padding: 0.6rem; }
  .sidebar-footer { flex-shrink: 0; padding: 0.75rem; border-top: 1px solid #2f2f2f; font-size: 0.75rem; color: #9b9b9b; }
  .sidebar-footer a { color: #9b9b9b; }
  .status-pill { font-weight: 600; padding: 0.1rem 0.4rem; border-radius: 4px; }
  .status-pill.available { color: var(--ok); }
  .status-pill.downloadable { color: var(--warn); }
  .status-pill.unavailable, .status-pill.missing { color: var(--bad); }

  /* --- Main column --- */
  #main-col { display: flex; flex-direction: column; height: 100%; min-width: 0; }
  #chat-header {
    flex-shrink: 0;
    display: flex; align-items: center; gap: 0.75rem;
    padding: 0.75rem 1rem;
    border-bottom: 1px solid var(--border);
    font-size: 0.85rem;
  }
  #hamburger-btn {
    display: none;
    background: transparent; border: none; color: var(--fg);
    font-size: 1.2rem; padding: 0.2rem 0.4rem;
  }
  #chat-log { flex: 1; min-height: 0; overflow-y: auto; }
  .empty-state {
    height: 100%; display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 1.1rem; text-align: center; padding: 1rem;
  }

  .message-row { padding: 1.25rem clamp(1rem, 4vw, 2rem); }
  .message-row .content { max-width: 48rem; margin: 0 auto; }
  .message-row.assistant .content { text-align: left; }
  .message-row.user .content { display: flex; justify-content: flex-end; }
  .message-row.user .bubble {
    max-width: 70%; background: var(--user-bubble-bg);
    border-radius: 1.25rem; padding: 0.6rem 1rem;
  }
  .md > *:first-child { margin-top: 0; }
  .md > *:last-child { margin-bottom: 0; }
  .md p, .md ul, .md ol { margin: 0.6rem 0; }
  .md ul, .md ol { padding-left: 1.25rem; }
  .md code { background: color-mix(in srgb, var(--fg) 10%, transparent); border-radius: 4px; padding: 0.1rem 0.3rem; font-size: 0.85em; }
  .md pre { background: color-mix(in srgb, var(--fg) 8%, transparent); border-radius: 6px; padding: 0.75rem; overflow-x: auto; margin: 0.6rem 0; }
  .md pre code { background: none; padding: 0; }

  #composer { flex-shrink: 0; }
  .composer-shell { max-width: 48rem; margin: 0 auto; padding: 0 1rem 1rem; }
  .composer-box {
    position: relative;
    border: 1px solid var(--border);
    border-radius: 1.5rem;
    box-shadow: 0 2px 6px rgba(0,0,0,.06);
    background: var(--bg);
    padding: 0.75rem 3rem 0.75rem 1rem;
  }
  .composer-box textarea {
    width: 100%; border: none; resize: none; background: transparent; color: var(--fg);
    max-height: 200px; overflow-y: auto; line-height: 1.4;
  }
  .composer-box textarea:focus { outline: none; }
  .send-btn {
    position: absolute; right: 0.5rem; bottom: 0.5rem;
    width: 2rem; height: 2rem; border-radius: 50%;
    background: var(--accent); color: var(--accent-fg); border: none;
    display: flex; align-items: center; justify-content: center; font-size: 0.9rem;
  }
  .send-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .composer-note { color: var(--muted); font-size: 0.78rem; text-align: center; margin-top: 0.5rem; min-height: 1.2em; }

  #sidebar-overlay { display: none; }

  @media (max-width: 768px) {
    #app { grid-template-columns: 1fr; }
    #sidebar {
      position: fixed; inset: 0 auto 0 0; width: 260px;
      transform: translateX(-100%); transition: transform .2s; z-index: 20;
    }
    #sidebar.open { transform: translateX(0); }
    #sidebar-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 10;
    }
    #sidebar-overlay.visible { display: block; }
    #hamburger-btn { display: inline-flex; }
  }
</style>
</head>
<body>
  <div id="app">
    <div id="sidebar-overlay"></div>
    <div id="sidebar">
      <div class="sidebar-header">
        <button id="new-chat-btn">+ New chat</button>
      </div>
      <div id="thread-list"></div>
      <div class="sidebar-footer">
        <div>Prompt API: <span class="status-pill" id="status-pill">checking…</span></div>
        <div style="margin-top:0.35rem;"><a href="https://github.com/nlade-core/chrome-chat" target="_blank" rel="noopener">Source</a> · Chrome desktop only</div>
      </div>
    </div>

    <div id="main-col">
      <div id="chat-header">
        <button id="hamburger-btn" aria-label="Toggle sidebar">☰</button>
        <span style="color:var(--muted);">chrome-chat — Gemini Nano, 100% on-device</span>
      </div>
      <div id="chat-log">
        <div class="empty-state" id="empty-state">Ask something to start a new conversation.</div>
      </div>
      <div id="composer">
        <div class="composer-shell">
          <div class="composer-box">
            <textarea id="chat-input" placeholder="Message chrome-chat…" rows="1"></textarea>
            <button class="send-btn" id="chat-send-btn" disabled aria-label="Send">➤</button>
          </div>
          <div class="composer-note" id="chat-note"></div>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { marked } from 'https://cdn.jsdelivr.net/npm/marked@18.0.11/lib/marked.esm.js';

    const statusPill = document.getElementById('status-pill');
    const newChatBtn = document.getElementById('new-chat-btn');
    const threadListEl = document.getElementById('thread-list');
    const emptyStateEl = document.getElementById('empty-state');
    const chatLog = document.getElementById('chat-log');
    const chatInput = document.getElementById('chat-input');
    const chatSendBtn = document.getElementById('chat-send-btn');
    const chatNote = document.getElementById('chat-note');
    const hamburgerBtn = document.getElementById('hamburger-btn');
    const sidebar = document.getElementById('sidebar');
    const sidebarOverlay = document.getElementById('sidebar-overlay');

    const SYSTEM_PROMPT = 'You are a helpful, concise assistant.';
    const PREFIX = 'chrome-chat:';
    const INDEX_KEY = PREFIX + 'index';
    const threadKey = (id) => PREFIX + 'thread:' + id;

    function loadIndex() { try { return JSON.parse(localStorage.getItem(INDEX_KEY)) || []; } catch { return []; } }
    function saveIndex(list) { localStorage.setItem(INDEX_KEY, JSON.stringify(list)); }
    function loadThreadMessages(id) { try { return JSON.parse(localStorage.getItem(threadKey(id))) || []; } catch { return []; } }
    function saveThreadMessages(id, msgs) { localStorage.setItem(threadKey(id), JSON.stringify(msgs)); }
    function deleteThread(id) { localStorage.removeItem(threadKey(id)); saveIndex(loadIndex().filter((t) => t.id !== id)); }

    function withTimeout(promise, ms) {
      return Promise.race([promise, new Promise((_, reject) => setTimeout(() => reject(new Error('timed out')), ms))]);
    }

    let promptOk = false;
    let session = null;
    let messages = [];
    let activeThreadId = null;

    async function checkCapability() {
      if (!self.LanguageModel) {
        statusPill.className = 'status-pill missing';
        statusPill.textContent = 'not in this browser';
        return;
      }
      try {
        const availability = await withTimeout(LanguageModel.availability(), 5000);
        promptOk = availability !== 'unavailable';
        statusPill.className = 'status-pill ' + (availability === 'available' ? 'available' : availability === 'unavailable' ? 'unavailable' : 'downloadable');
        statusPill.textContent = availability === 'downloadable' ? 'needs download' : availability;
      } catch (e) {
        statusPill.className = 'status-pill unavailable';
        statusPill.textContent = 'error: ' + e.message;
      }
      if (promptOk) chatSendBtn.disabled = false;
      else chatNote.textContent = 'The Prompt API isn\'t available in this browser right now.';
    }
    checkCapability();

    function escapeHtml(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
    function renderMarkdown(text) { return '<div class="md">' + marked.parse(escapeHtml(text)) + '</div>'; }

    let stickToBottom = true;

    function renderChat() {
      const hasMessages = messages.length > 0;
      emptyStateEl.style.display = hasMessages ? 'none' : 'flex';
      chatLog.querySelectorAll('.message-row').forEach((el) => el.remove());
      messages.forEach((m) => {
        const row = document.createElement('div');
        row.className = 'message-row ' + m.role;
        const inner = m.role === 'user'
          ? '<div class="content"><div class="bubble">' + renderMarkdown(m.content) + '</div></div>'
          : '<div class="content">' + renderMarkdown(m.content) + '</div>';
        row.innerHTML = inner;
        chatLog.appendChild(row);
      });
      if (stickToBottom) chatLog.scrollTop = chatLog.scrollHeight;
    }
    chatLog.addEventListener('scroll', () => {
      stickToBottom = chatLog.scrollHeight - chatLog.scrollTop - chatLog.clientHeight < 40;
    });

    function renderThreadList() {
      const threads = loadIndex().sort((a, b) => b.updatedAt - a.updatedAt);
      threadListEl.innerHTML = threads.length
        ? threads.map((t) => (
            '<div class="thread-item ' + (t.id === activeThreadId ? 'active' : '') + '" data-id="' + t.id + '">' +
              '<span class="thread-title">' + escapeHtml(t.title) + '</span>' +
              '<button class="thread-delete" data-id="' + t.id + '" title="Delete">×</button>' +
            '</div>'
          )).join('')
        : '<div class="empty-hint">No saved conversations yet.</div>';
    }
    renderThreadList();

    function destroySession() {
      if (session) { try { session.destroy(); } catch {} }
      session = null;
    }

    function persistActiveThread() {
      const isNewThread = activeThreadId === null;
      if (isNewThread) activeThreadId = crypto.randomUUID();
      const index = loadIndex();
      const existing = index.find((t) => t.id === activeThreadId);
      const title = existing ? existing.title : titleFrom(messages[0]?.content || 'New chat');
      const updated = index.filter((t) => t.id !== activeThreadId);
      updated.push({ id: activeThreadId, title, updatedAt: Date.now() });
      saveIndex(updated);
      saveThreadMessages(activeThreadId, messages);
      renderThreadList();
    }

    function titleFrom(text) {
      const t = text.trim().replace(/\s+/g, ' ');
      return t.length > 40 ? t.slice(0, 40) + '…' : t;
    }

    function closeSidebarMobile() {
      sidebar.classList.remove('open');
      sidebarOverlay.classList.remove('visible');
    }

    function startNewChat() {
      destroySession();
      activeThreadId = null;
      messages = [];
      stickToBottom = true;
      renderChat();
      renderThreadList();
      chatNote.textContent = '';
      closeSidebarMobile();
    }

    async function openThread(id) {
      destroySession();
      activeThreadId = id;
      messages = loadThreadMessages(id);
      stickToBottom = true;
      renderChat();
      renderThreadList();
      closeSidebarMobile();
      if (!promptOk) return;
      chatSendBtn.disabled = true;
      chatNote.textContent = 'Loading this conversation into the model…';
      try {
        session = await LanguageModel.create({
          initialPrompts: [{ role: 'system', content: SYSTEM_PROMPT }, ...messages.map((m) => ({ role: m.role, content: m.content }))],
        });
        chatNote.textContent = '';
      } catch (e) {
        chatNote.textContent = 'Could not restore into the model: ' + e.message;
      }
      chatSendBtn.disabled = false;
    }

    newChatBtn.addEventListener('click', startNewChat);
    threadListEl.addEventListener('click', (e) => {
      const delBtn = e.target.closest('.thread-delete');
      if (delBtn) {
        const id = delBtn.dataset.id;
        deleteThread(id);
        if (id === activeThreadId) startNewChat(); else renderThreadList();
        return;
      }
      const item = e.target.closest('.thread-item');
      if (item) openThread(item.dataset.id);
    });

    hamburgerBtn.addEventListener('click', () => {
      sidebar.classList.add('open');
      sidebarOverlay.classList.add('visible');
    });
    sidebarOverlay.addEventListener('click', closeSidebarMobile);
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSidebarMobile(); });

    function autoResize() {
      chatInput.style.height = 'auto';
      chatInput.style.height = chatInput.scrollHeight + 'px';
    }
    chatInput.addEventListener('input', autoResize);

    async function sendChat() {
      const text = chatInput.value.trim();
      if (!text || !promptOk) return;
      chatSendBtn.disabled = true;
      chatInput.value = '';
      autoResize();
      messages.push({ role: 'user', content: text });
      stickToBottom = true;
      renderChat();
      chatNote.textContent = 'Generating…';

      try {
        if (!session) {
          chatNote.textContent = 'Starting session (may download the model on first use)…';
          session = await LanguageModel.create({
            initialPrompts: [{ role: 'system', content: SYSTEM_PROMPT }],
            monitor(m) {
              m.addEventListener('downloadprogress', (e) => {
                chatNote.textContent = 'Downloading model… ' + Math.round(e.loaded * 100) + '%';
              });
            },
          });
        }
        const assistantMsg = { role: 'assistant', content: '' };
        messages.push(assistantMsg);
        renderChat();
        const stream = session.promptStreaming([{ role: 'user', content: [{ type: 'text', value: text }] }]);
        for await (const chunk of stream) {
          assistantMsg.content += chunk;
          renderChat();
        }
        chatNote.textContent = '';
        persistActiveThread();
      } catch (e) {
        chatNote.textContent = 'Error: ' + e.message;
      }
      chatSendBtn.disabled = false;
    }

    chatSendBtn.addEventListener('click', sendChat);
    chatInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChat(); }
    });
  </script>
</body>
</html>
