<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>chrome-chat</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    line-height: 1.5;
  }
  input, button, textarea { font: inherit; }
  button { cursor: pointer; }

  :root {
    --bg: #ffffff;
    --fg: #111111;
    --muted: #6e6e80;
    --border: #e5e5e5;
    --accent: #0a58ca;
    --accent-fg: #ffffff;
    --user-bubble-bg: #f0f4ff;
    --ok: #1a7f37;
    --warn: #9a6700;
    --bad: #cf222e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #212121;
      --fg: #ececf1;
      --muted: #9b9b9b;
      --border: #3a3a3a;
      --accent: #6ea8fe;
      --accent-fg: #0d1117;
      --user-bubble-bg: #2f2f3a;
      --ok: #3fb950;
      --warn: #d29922;
      --bad: #ff7b72;
    }
  }

  #app {
    display: grid;
    grid-template-columns: 260px 1fr;
    grid-template-rows: 100%;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    background: var(--bg);
    color: var(--fg);
  }

  /* --- Sidebar: always-dark, independent of prefers-color-scheme --- */
  #sidebar {
    display: flex;
    flex-direction: column;
    height: 100%;
    background: #171717;
    color: #ececf1;
  }
  .sidebar-header { flex-shrink: 0; padding: 0.75rem; }
  #new-chat-btn {
    width: 100%;
    background: transparent;
    color: #ececf1;
    border: 1px solid #4d4d4d;
    border-radius: 8px;
    padding: 0.6rem 0.75rem;
    font-size: 0.9rem;
    text-align: left;
  }
  #new-chat-btn:hover { background: #2a2a2a; }
  #thread-search {
    width: 100%; margin-top: 0.5rem;
    background: #2a2a2a; color: #ececf1; border: 1px solid #4d4d4d;
    border-radius: 8px; padding: 0.45rem 0.65rem; font-size: 0.82rem;
  }
  #thread-search::placeholder { color: #8a8a8a; }
  #thread-list { flex: 1; min-height: 0; overflow-y: auto; padding: 0 0.5rem; }
  .thread-item {
    display: flex; align-items: center; gap: 0.3rem;
    padding: 0.6rem 0.6rem; border-radius: 6px; cursor: pointer; font-size: 0.85rem;
  }
  .thread-item:hover { background: #2a2a2a; }
  .thread-item.active { background: #343541; font-weight: 600; }
  .thread-item .thread-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .thread-item .thread-rename-input {
    flex: 1; min-width: 0; background: #0d0d0d; color: #ececf1;
    border: 1px solid #6ea8fe; border-radius: 4px; padding: 0.1rem 0.4rem; font-size: 0.85rem;
  }
  .thread-item .thread-rename, .thread-item .thread-delete {
    background: transparent; color: #9b9b9b; border: none;
    padding: 0.1rem 0.4rem; font-size: 0.85rem; border-radius: 4px; flex-shrink: 0;
  }
  .thread-item .thread-rename:hover { background: #ffffff1a; color: #ececf1; }
  .thread-item .thread-delete:hover { background: #ff7b7222; color: #ff7b72; }
  .thread-item .thread-delete.confirming { background: #ff7b7222; color: #ff7b72; font-weight: 600; }
  .empty-hint { color: #9b9b9b; font-size: 0.8rem; padding: 0.6rem; }
  .family-row {
    display: flex; align-items: center; gap: 0.3rem;
    padding: 0.6rem 0.6rem; border-radius: 6px; cursor: pointer; font-size: 0.85rem;
  }
  .family-row:hover { background: #2a2a2a; }
  .family-row.active { background: #343541; font-weight: 600; }
  .family-chevron { flex-shrink: 0; color: #9b9b9b; font-size: 0.7rem; width: 0.9rem; }
  .family-row .thread-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .family-count {
    flex-shrink: 0; background: #3a3a3a; color: #ececf1; font-size: 0.7rem;
    border-radius: 999px; padding: 0.05rem 0.45rem;
  }
  .family-children { margin-left: 1.1rem; border-left: 1px solid #3a3a3a; padding-left: 0.4rem; }
  .family-child-wrap { margin-bottom: 0.2rem; }
  .family-child-meta { color: #8a8a8a; font-size: 0.7rem; padding: 0 0.6rem 0.3rem; }
  .delete-fork-warning { color: #ff7b72; font-size: 0.68rem; padding: 0 0.6rem 0.4rem; }
  .sidebar-footer { flex-shrink: 0; padding: 0.75rem; border-top: 1px solid #2f2f2f; font-size: 0.75rem; color: #9b9b9b; }
  .sidebar-footer a { color: #9b9b9b; }
  .status-pill { font-weight: 600; padding: 0.1rem 0.4rem; border-radius: 4px; }
  .status-pill.available { color: var(--ok); }
  .status-pill.downloadable { color: var(--warn); }
  .status-pill.unavailable, .status-pill.missing { color: var(--bad); }

  /* --- Main column --- */
  #main-col { display: flex; flex-direction: column; height: 100%; min-width: 0; position: relative; }
  #scroll-bottom-btn {
    position: absolute; bottom: 88px; left: 50%; transform: translateX(-50%);
    width: 2.2rem; height: 2.2rem; border-radius: 50%;
    background: var(--bg); border: 1px solid var(--border); color: var(--fg);
    box-shadow: 0 2px 8px rgba(0,0,0,.15);
    display: flex; align-items: center; justify-content: center; font-size: 1rem;
    z-index: 5;
  }
  #scroll-bottom-btn:hover { background: color-mix(in srgb, var(--accent) 10%, var(--bg)); }
  #chat-header {
    flex-shrink: 0;
    display: flex; align-items: center; gap: 0.75rem;
    padding: 0.75rem 1rem;
    border-bottom: 1px solid var(--border);
    font-size: 0.85rem;
  }
  #hamburger-btn {
    display: none;
    background: transparent; border: none; color: var(--fg);
    font-size: 1.2rem; padding: 0.2rem 0.4rem;
  }
  #chat-log { flex: 1; min-height: 0; overflow-y: auto; }
  .empty-state {
    height: 100%; display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 1.1rem; text-align: center; padding: 1rem;
  }

  .message-row { padding: 1.25rem clamp(1rem, 4vw, 2rem); }
  .message-row .content { max-width: 48rem; margin: 0 auto; }
  .message-row.assistant .content { text-align: left; }
  .message-row.user .content { display: flex; justify-content: flex-end; }
  .message-row.user .user-wrap { display: flex; flex-direction: column; align-items: flex-end; max-width: 70%; }
  .message-row.user .bubble {
    background: var(--user-bubble-bg);
    border-radius: 1.25rem; padding: 0.6rem 1rem;
  }
  .message-row.user .msg-actions { margin-top: 0.3rem; margin-right: 0.2rem; }
  .message-row.user .user-wrap.edit-mode { width: 100%; max-width: 34rem; align-items: stretch; }
  .edit-textarea {
    width: 100%; min-height: 3rem; max-height: 260px;
    border: 1px solid var(--accent); border-radius: 1rem;
    background: var(--bg); color: var(--fg);
    padding: 0.6rem 1rem; resize: none; overflow-y: auto; line-height: 1.4;
  }
  .edit-textarea:focus { outline: none; }
  .edit-warning { color: var(--warn); font-size: 0.78rem; margin-top: 0.4rem; text-align: right; }
  .save-edit-btn { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  .md > *:first-child { margin-top: 0; }
  .md > *:last-child { margin-bottom: 0; }
  .md p, .md ul, .md ol { margin: 0.6rem 0; }
  .md ul, .md ol { padding-left: 1.25rem; }
  .md code { background: color-mix(in srgb, var(--fg) 10%, transparent); border-radius: 4px; padding: 0.1rem 0.3rem; font-size: 0.85em; }
  .md pre { background: color-mix(in srgb, var(--fg) 8%, transparent); border-radius: 6px; padding: 0.75rem; overflow-x: auto; margin: 0.6rem 0; }
  .md pre code { background: none; padding: 0; }

  .msg-actions { margin-top: 0.5rem; display: flex; gap: 0.4rem; }
  .msg-actions .icon-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 6px;
    padding: 0.2rem 0.55rem;
    font-size: 0.75rem;
  }
  .msg-actions .icon-btn:hover { color: var(--fg); background: color-mix(in srgb, var(--accent) 10%, transparent); }

  #composer { flex-shrink: 0; }
  .composer-shell { max-width: 48rem; margin: 0 auto; padding: 0 1rem 1rem; }
  .composer-box {
    position: relative;
    border: 1px solid var(--border);
    border-radius: 1.5rem;
    box-shadow: 0 2px 6px rgba(0,0,0,.06);
    background: var(--bg);
    padding: 0.75rem 3rem 0.75rem 2.75rem;
  }
  .composer-box textarea {
    width: 100%; border: none; resize: none; background: transparent; color: var(--fg);
    max-height: 200px; overflow-y: auto; line-height: 1.4;
  }
  .composer-box textarea:focus { outline: none; }
  .attach-btn {
    position: absolute; left: 0.5rem; bottom: 0.5rem;
    width: 2rem; height: 2rem; border-radius: 50%;
    background: transparent; color: var(--muted); border: none; font-size: 1rem;
    display: flex; align-items: center; justify-content: center;
  }
  .attach-btn:hover { background: color-mix(in srgb, var(--accent) 10%, transparent); }
  .attachment-chip {
    display: flex; align-items: center; gap: 0.5rem;
    background: color-mix(in srgb, var(--accent) 8%, var(--bg));
    border: 1px solid var(--border); border-radius: 0.75rem;
    padding: 0.4rem 0.7rem; margin-bottom: 0.5rem; font-size: 0.82rem; color: var(--fg);
  }
  .attachment-chip span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .attachment-chip button {
    background: transparent; border: none; color: var(--muted); font-size: 0.95rem; padding: 0 0.2rem;
  }
  .msg-attachment-img { max-width: 100%; max-height: 220px; border-radius: 0.75rem; margin-bottom: 0.5rem; }
  .msg-attachment-audio { width: 100%; margin-bottom: 0.5rem; }
  .msg-attachment-missing { color: var(--muted); font-size: 0.8rem; font-style: italic; margin-bottom: 0.4rem; }
  .send-btn {
    position: absolute; right: 0.5rem; bottom: 0.5rem;
    width: 2rem; height: 2rem; border-radius: 50%;
    background: var(--accent); color: var(--accent-fg); border: none;
    display: flex; align-items: center; justify-content: center; font-size: 0.9rem;
  }
  .send-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .stop-btn { background: var(--fg); color: var(--bg); }
  .composer-note { color: var(--muted); font-size: 0.78rem; text-align: center; margin-top: 0.5rem; min-height: 1.2em; }
  .composer-note.warn { color: var(--warn); font-weight: 600; }

  #sidebar-overlay { display: none; }

  @media (max-width: 768px) {
    #app { grid-template-columns: 1fr; }
    #sidebar {
      position: fixed; inset: 0 auto 0 0; width: 260px;
      transform: translateX(-100%); transition: transform .2s; z-index: 20;
    }
    #sidebar.open { transform: translateX(0); }
    #sidebar-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 10;
    }
    #sidebar-overlay.visible { display: block; }
    #hamburger-btn { display: inline-flex; }
  }
</style>
</head>
<body>
  <div id="app">
    <div id="sidebar-overlay"></div>
    <div id="sidebar">
      <div class="sidebar-header">
        <button id="new-chat-btn">+ New chat</button>
        <input type="text" id="thread-search" placeholder="Search conversations…">
      </div>
      <div id="thread-list"></div>
      <div class="sidebar-footer">
        <div>Prompt API: <span class="status-pill" id="status-pill">checking…</span></div>
        <div style="margin-top:0.35rem;"><a href="https://github.com/nlade-core/chrome-chat" target="_blank" rel="noopener">Source</a> · Chrome desktop only</div>
      </div>
    </div>

    <div id="main-col">
      <div id="chat-header">
        <button id="hamburger-btn" aria-label="Toggle sidebar">☰</button>
        <span style="color:var(--muted);">chrome-chat — Gemini Nano, 100% on-device</span>
      </div>
      <div id="chat-log">
        <div class="empty-state" id="empty-state">Ask something to start a new conversation.</div>
      </div>
      <button id="scroll-bottom-btn" style="display:none;" aria-label="Scroll to bottom">↓</button>
      <div id="composer">
        <div class="composer-shell">
          <div class="attachment-chip" id="attachment-chip" style="display:none;">
            <span id="attachment-name"></span>
            <button id="remove-attachment-btn" aria-label="Remove attachment">×</button>
          </div>
          <div class="composer-box">
            <button class="attach-btn" id="attach-btn" type="button" aria-label="Attach an image or audio clip">📎</button>
            <input type="file" id="attach-input" accept="image/*,audio/*" style="display:none;">
            <textarea id="chat-input" placeholder="Message chrome-chat…" rows="1"></textarea>
            <button class="send-btn" id="chat-send-btn" disabled aria-label="Send">➤</button>
            <button class="send-btn stop-btn" id="chat-stop-btn" style="display:none;" aria-label="Stop generating">■</button>
          </div>
          <div class="composer-note" id="chat-note"></div>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { marked } from 'https://cdn.jsdelivr.net/npm/marked@18.0.11/lib/marked.esm.js';

    const statusPill = document.getElementById('status-pill');
    const newChatBtn = document.getElementById('new-chat-btn');
    const threadListEl = document.getElementById('thread-list');
    const threadSearchInput = document.getElementById('thread-search');
    const emptyStateEl = document.getElementById('empty-state');
    const chatLog = document.getElementById('chat-log');
    const scrollBottomBtn = document.getElementById('scroll-bottom-btn');
    const chatInput = document.getElementById('chat-input');
    const chatSendBtn = document.getElementById('chat-send-btn');
    const chatStopBtn = document.getElementById('chat-stop-btn');
    const attachBtn = document.getElementById('attach-btn');
    const attachInput = document.getElementById('attach-input');
    const attachmentChip = document.getElementById('attachment-chip');
    const attachmentNameEl = document.getElementById('attachment-name');
    const removeAttachmentBtn = document.getElementById('remove-attachment-btn');
    const chatNote = document.getElementById('chat-note');
    const hamburgerBtn = document.getElementById('hamburger-btn');
    const sidebar = document.getElementById('sidebar');
    const sidebarOverlay = document.getElementById('sidebar-overlay');

    const SYSTEM_PROMPT = 'You are a helpful, concise assistant.';
    const PREFIX = 'chrome-chat:';
    const INDEX_KEY = PREFIX + 'index';
    const threadKey = (id) => PREFIX + 'thread:' + id;

    // Schema version for the INDEX specifically (not the per-thread message
    // arrays, which haven't changed shape yet -- this same pattern extends
    // to those too if that ever changes). v1 (implicit, never stamped) was a
    // bare array; v2 wraps it with a version tag so a future shape change
    // can be detected and migrated instead of silently misread or crashing.
    const SCHEMA_VERSION = 2;

    function loadIndex() {
      let raw;
      try { raw = JSON.parse(localStorage.getItem(INDEX_KEY)); } catch { return []; }
      if (raw == null) return [];
      if (Array.isArray(raw)) return raw; // v1, unversioned -- migrates transparently on the next saveIndex()
      if (Array.isArray(raw.threads)) return raw.threads; // v2 (or any future version using this same wrapper shape)
      return []; // unrecognized shape -- fail safe rather than crash
    }
    function saveIndex(list) { localStorage.setItem(INDEX_KEY, JSON.stringify({ version: SCHEMA_VERSION, threads: list })); }
    function loadThreadMessages(id) { try { return JSON.parse(localStorage.getItem(threadKey(id))) || []; } catch { return []; } }
    function saveThreadMessages(id, msgs) { localStorage.setItem(threadKey(id), JSON.stringify(msgs)); }
    // Attachments (images/audio) are binary and can genuinely get large --
    // localStorage is text-only with a small quota, so they live in their own
    // IndexedDB store instead, referenced from a message by attachmentId
    // rather than embedding the blob directly. Everything else (threads,
    // messages, the index) stays in localStorage untouched -- this is a
    // narrow, additive change, not a storage-layer rewrite.
    const BLOB_DB_NAME = 'chrome-chat-attachments';
    const BLOB_STORE_NAME = 'blobs';
    let blobDbPromise = null;
    function openBlobDb() {
      if (!blobDbPromise) {
        blobDbPromise = new Promise((resolve, reject) => {
          const req = indexedDB.open(BLOB_DB_NAME, 1);
          req.onupgradeneeded = () => req.result.createObjectStore(BLOB_STORE_NAME, { keyPath: 'id' });
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        });
      }
      return blobDbPromise;
    }
    async function putBlob(blob) {
      const db = await openBlobDb();
      const id = crypto.randomUUID();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(BLOB_STORE_NAME, 'readwrite');
        tx.objectStore(BLOB_STORE_NAME).put({ id, blob });
        tx.oncomplete = () => resolve(id);
        tx.onerror = () => reject(tx.error);
      });
    }
    async function getBlob(id) {
      const db = await openBlobDb();
      return new Promise((resolve, reject) => {
        const req = db.transaction(BLOB_STORE_NAME, 'readonly').objectStore(BLOB_STORE_NAME).get(id);
        req.onsuccess = () => resolve(req.result ? req.result.blob : undefined);
        req.onerror = () => reject(req.error);
      });
    }
    async function deleteBlob(id) {
      const db = await openBlobDb();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(BLOB_STORE_NAME, 'readwrite');
        tx.objectStore(BLOB_STORE_NAME).delete(id);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    // For every message with a durable attachmentId but no live attachmentUrl
    // yet (just restored from storage this page load), fetch its real blob
    // and mint a fresh object URL so renderAttachmentHtml shows the actual
    // image/audio again instead of the "not saved" marker. Failures (missing
    // blob, IndexedDB error) are left to fall back to that marker rather than
    // thrown -- an honest "this one's gone" beats a broken page.
    async function hydrateAttachments(msgs) {
      await Promise.all(msgs.filter((m) => m.attachmentId && !m.attachmentUrl).map(async (m) => {
        try {
          const blob = await getBlob(m.attachmentId);
          if (blob) m.attachmentUrl = URL.createObjectURL(blob);
        } catch { /* leave unset -- renders as the disclosed fallback marker */ }
      }));
    }

    // Deletes any attachment blobs that belonged only to this thread. A fork
    // shares its pre-fork messages (and their attachmentIds) with the thread
    // it was forked from, so a blob is only actually safe to delete once no
    // *surviving* thread's messages still reference it.
    async function cleanupOrphanedAttachments(removedMsgs, remainingIndex) {
      const removedIds = removedMsgs.filter((m) => m.attachmentId).map((m) => m.attachmentId);
      if (!removedIds.length) return;
      const stillReferenced = new Set();
      for (const t of remainingIndex) {
        for (const m of loadThreadMessages(t.id)) {
          if (m.attachmentId) stillReferenced.add(m.attachmentId);
        }
      }
      await Promise.all(
        removedIds.filter((id) => !stillReferenced.has(id)).map((id) => deleteBlob(id).catch(() => {}))
      );
    }

    function deleteThread(id) {
      const msgs = loadThreadMessages(id);
      localStorage.removeItem(threadKey(id));
      const remainingIndex = loadIndex().filter((t) => t.id !== id);
      saveIndex(remainingIndex);
      cleanupOrphanedAttachments(msgs, remainingIndex);
    }

    function withTimeout(promise, ms) {
      return Promise.race([promise, new Promise((_, reject) => setTimeout(() => reject(new Error('timed out')), ms))]);
    }

    let promptOk = false;
    let streaming = false;
    let session = null;
    let messages = [];
    let activeThreadId = null;
    let pendingForkMeta = null; // { forkedFrom, forkRoot } to attach the next time persistActiveThread() mints a brand-new thread id
    let editingIndex = null; // index of the user message currently being edited inline, or null
    let renamingId = null; // thread id currently showing an inline rename input, or null
    let pendingDeleteId = null; // thread id armed for delete on a second click, or null
    let pendingDeleteTimer = null;
    let searchQuery = '';
    let expandedFamilyRoot = null; // root id of the currently-expanded fork family in the sidebar, or null
    let pendingAttachment = null; // { file: File, type: 'image'|'audio' } queued for the next send, or null

    async function checkCapability() {
      if (!self.LanguageModel) {
        statusPill.className = 'status-pill missing';
        statusPill.textContent = 'not in this browser';
        return;
      }
      try {
        const availability = await withTimeout(LanguageModel.availability(), 5000);
        promptOk = availability !== 'unavailable';
        statusPill.className = 'status-pill ' + (availability === 'available' ? 'available' : availability === 'unavailable' ? 'unavailable' : 'downloadable');
        statusPill.textContent = availability === 'downloadable' ? 'needs download' : availability;
      } catch (e) {
        statusPill.className = 'status-pill unavailable';
        statusPill.textContent = 'error: ' + e.message;
      }
      if (promptOk) chatSendBtn.disabled = false;
      else chatNote.textContent = 'The Prompt API isn\'t available in this browser right now.';
    }
    checkCapability();

    function escapeHtml(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
    function renderMarkdown(text) { return '<div class="md">' + marked.parse(escapeHtml(text)) + '</div>'; }

    let stickToBottom = true;

    // Copy/Regenerate only make sense on a finished assistant reply -- the
    // last message while a stream is still in flight is still growing, so
    // it's excluded. Edit and Regenerate are further restricted to only the
    // *last* exchange, since editing/regenerating anything earlier would
    // need to discard everything after it anyway (handled by the truncation
    // in editMessage/regenerateFrom) -- showing the action only where it's
    // actually reachable avoids a button that looks available but silently
    // deletes a bunch of later conversation when clicked.
    // The real blob is durable, stored in IndexedDB and referenced by
    // attachmentId (see putBlob/getBlob above); attachmentUrl is just an
    // in-memory display cache -- an object URL only ever valid for this page
    // load, never persisted (persistActiveThread strips it). A freshly sent
    // message gets its attachmentUrl immediately in sendText; a restored one
    // gets it asynchronously via hydrateAttachments before its first render.
    // attachmentUrl is only ever created ONCE per message and reused on every
    // re-render (not regenerated here) -- renderChat() rebuilds every row
    // from scratch on every streamed chunk of a reply, so minting a fresh
    // blob URL in here would recreate it many times a second, forcing the
    // browser to redecode the image from scratch each time and visibly
    // flicker/reflow while the *next* message streams in below it.
    function renderAttachmentHtml(m) {
      if (m.attachmentUrl) {
        return m.attachmentType === 'image'
          ? '<img class="msg-attachment-img" src="' + m.attachmentUrl + '" alt="Attached image">'
          : '<audio class="msg-attachment-audio" controls src="' + m.attachmentUrl + '"></audio>';
      }
      if (m.attachmentType) {
        return '<div class="msg-attachment-missing">📎 ' + m.attachmentType + ' attached (unavailable)</div>';
      }
      return '';
    }

    function renderChat() {
      const hasMessages = messages.length > 0;
      emptyStateEl.style.display = hasMessages ? 'none' : 'flex';
      chatLog.querySelectorAll('.message-row').forEach((el) => el.remove());
      const lastIndex = messages.length - 1;
      messages.forEach((m, i) => {
        const row = document.createElement('div');
        row.className = 'message-row ' + m.role;
        if (m.role === 'user') {
          if (i === editingIndex) {
            // Editing an earlier message inherently discards everything
            // after it (sequential conversation context can't fork), so
            // when this isn't the last message, say exactly how much would
            // go before it's actually committed -- no silent surprise.
            const discardCount = lastIndex - i;
            const warning = discardCount > 0
              ? '<div class="edit-warning">Saving will also remove the ' + discardCount + ' message' + (discardCount === 1 ? '' : 's') + ' after this one.</div>'
              : '';
            row.innerHTML = '<div class="content"><div class="user-wrap edit-mode">' +
              '<textarea class="edit-textarea" data-i="' + i + '">' + escapeHtml(m.content) + '</textarea>' +
              warning +
              '<div class="msg-actions">' +
                '<button class="icon-btn cancel-edit-btn" data-i="' + i + '">Cancel</button>' +
                '<button class="icon-btn fork-edit-btn" data-i="' + i + '" title="Keep the original conversation untouched; continue this edit as a new one">Fork</button>' +
                '<button class="icon-btn save-edit-btn" data-i="' + i + '">Save &amp; submit</button>' +
              '</div></div></div>';
          } else {
            // Any user message can be edited -- only gated on nothing else
            // already being edited and no generation in progress. Entering
            // edit mode is free and fully reversible (see startEdit/
            // cancelEdit), so there's no need to restrict *which* message
            // can be opened; the discard warning above is what protects
            // against a surprise when actually confirming one.
            const editBtn = (!streaming && editingIndex === null)
              ? '<div class="msg-actions"><button class="icon-btn edit-btn" data-i="' + i + '">Edit</button></div>' : '';
            row.innerHTML = '<div class="content"><div class="user-wrap"><div class="bubble">' + renderAttachmentHtml(m) + renderMarkdown(m.content) + '</div>' + editBtn + '</div></div>';
          }
        } else {
          const isLastAndStreaming = streaming && i === lastIndex;
          let actions = '';
          if (!isLastAndStreaming) {
            actions = '<div class="msg-actions"><button class="icon-btn copy-btn" data-i="' + i + '">Copy</button>';
            if (i === lastIndex && !streaming) {
              actions += '<button class="icon-btn regen-btn" data-i="' + i + '">Regenerate</button>';
            }
            actions += '</div>';
          }
          row.innerHTML = '<div class="content">' + renderMarkdown(m.content) + actions + '</div>';
        }
        chatLog.appendChild(row);
      });
      if (editingIndex !== null) {
        const ta = chatLog.querySelector('.edit-textarea[data-i="' + editingIndex + '"]');
        if (ta) {
          ta.style.height = 'auto';
          ta.style.height = ta.scrollHeight + 'px';
          ta.focus();
          ta.setSelectionRange(ta.value.length, ta.value.length);
        }
      }
      if (stickToBottom) {
        chatLog.scrollTop = chatLog.scrollHeight;
        scrollBottomBtn.style.display = 'none';
      }
    }
    chatLog.addEventListener('scroll', () => {
      stickToBottom = chatLog.scrollHeight - chatLog.scrollTop - chatLog.clientHeight < 40;
      scrollBottomBtn.style.display = stickToBottom ? 'none' : 'flex';
    });
    scrollBottomBtn.addEventListener('click', () => {
      stickToBottom = true;
      chatLog.scrollTop = chatLog.scrollHeight;
      scrollBottomBtn.style.display = 'none';
    });
    chatLog.addEventListener('click', async (e) => {
      const copyBtn = e.target.closest('.copy-btn');
      if (copyBtn) {
        const i = Number(copyBtn.dataset.i);
        await navigator.clipboard.writeText(messages[i].content);
        const original = copyBtn.textContent;
        copyBtn.textContent = 'Copied';
        setTimeout(() => { copyBtn.textContent = original; }, 1500);
        return;
      }
      const editBtn = e.target.closest('.edit-btn');
      if (editBtn) { startEdit(Number(editBtn.dataset.i)); return; }
      const cancelEditBtn = e.target.closest('.cancel-edit-btn');
      if (cancelEditBtn) { cancelEdit(); return; }
      const saveEditBtn = e.target.closest('.save-edit-btn');
      if (saveEditBtn) {
        const i = Number(saveEditBtn.dataset.i);
        const textarea = chatLog.querySelector('.edit-textarea[data-i="' + i + '"]');
        await confirmEdit(i, textarea.value);
        return;
      }
      const forkEditBtn = e.target.closest('.fork-edit-btn');
      if (forkEditBtn) {
        const i = Number(forkEditBtn.dataset.i);
        const textarea = chatLog.querySelector('.edit-textarea[data-i="' + i + '"]');
        await forkFrom(i, textarea.value);
        return;
      }
      const regenBtn = e.target.closest('.regen-btn');
      if (regenBtn) { regenerateFrom(Number(regenBtn.dataset.i)); return; }
    });
    chatLog.addEventListener('input', (e) => {
      if (!e.target.matches('.edit-textarea')) return;
      e.target.style.height = 'auto';
      e.target.style.height = e.target.scrollHeight + 'px';
    });
    chatLog.addEventListener('keydown', async (e) => {
      if (!e.target.matches('.edit-textarea')) return;
      const i = Number(e.target.dataset.i);
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        await confirmEdit(i, e.target.value);
      } else if (e.key === 'Escape') {
        e.preventDefault();
        cancelEdit();
      }
    });

    // Full-content search, not just titles -- titles are only the first ~40
    // characters of a thread's first message, so title-only search would
    // miss most of what a conversation actually contains.
    function threadMatchesQuery(t, query) {
      if (!query) return true;
      const q = query.toLowerCase();
      if (t.title.toLowerCase().includes(q)) return true;
      return loadThreadMessages(t.id).some((m) => m.content.toLowerCase().includes(q));
    }

    function countForksOf(id) {
      return loadIndex().filter((t) => t.forkedFrom === id).length;
    }

    function formatRelativeTime(ts) {
      const mins = Math.round((Date.now() - ts) / 60000);
      if (mins < 1) return 'just now';
      if (mins < 60) return mins + 'm ago';
      const hours = Math.round(mins / 60);
      if (hours < 24) return hours + 'h ago';
      return Math.round(hours / 24) + 'd ago';
    }

    // Shared by a standalone (never-forked) thread and by each row inside an
    // expanded fork family -- same markup, same rename/delete affordances,
    // just an extra class when nested so it can be styled/indented.
    function renderThreadItemRow(t, indented) {
      const titleHtml = t.id === renamingId
        ? '<input class="thread-rename-input" data-id="' + t.id + '" value="' + escapeHtml(t.title) + '">'
        : '<span class="thread-title">' + escapeHtml(t.title) + '</span>';
      const deleteLabel = t.id === pendingDeleteId ? 'Sure?' : '×';
      const row = '<div class="thread-item ' + (indented ? 'family-child ' : '') + (t.id === activeThreadId ? 'active' : '') + '" data-id="' + t.id + '">' +
        titleHtml +
        (t.id === renamingId ? '' : '<button class="thread-rename" data-id="' + t.id + '" title="Rename">✎</button>') +
        '<button class="thread-delete ' + (t.id === pendingDeleteId ? 'confirming' : '') + '" data-id="' + t.id + '" title="Delete">' + deleteLabel + '</button>' +
      '</div>';
      // Disclosed, not blocked -- deleting a thread other conversations were
      // forked from is allowed, but the confirm state says so plainly first.
      // Orphaned children keep their forkedFrom pointing at a now-missing
      // id; renderThreadList()'s family-label fallback already handles that
      // gracefully rather than crashing.
      if (t.id === pendingDeleteId) {
        const forkCount = countForksOf(t.id);
        if (forkCount > 0) {
          return row + '<div class="delete-fork-warning">Has ' + forkCount + ' fork' + (forkCount === 1 ? '' : 's') +
            ' -- ' + (forkCount === 1 ? 'it' : 'they') + ' will be kept, shown as forked from a deleted conversation.</div>';
        }
      }
      return row;
    }

    function renderThreadList() {
      const allThreads = loadIndex().sort((a, b) => b.updatedAt - a.updatedAt);
      const threads = allThreads.filter((t) => threadMatchesQuery(t, searchQuery));
      if (threads.length) {
        // Group by fork family: everyone sharing the same forkRoot (or, for
        // a never-forked thread, its own id). No member is auto-selected as
        // "primary" -- lineage is fixed, but which one you're shown is a
        // deliberate, neutral choice via the expand/pick UI below, not a
        // recency-derived default.
        const families = new Map();
        threads.forEach((t) => {
          const rootId = t.forkRoot || t.id;
          if (!families.has(rootId)) families.set(rootId, []);
          families.get(rootId).push(t);
        });
        const familyGroups = Array.from(families.entries());
        // Ordered by each family's most-recently-updated member -- a scan
        // order for the sidebar, not a selection of which member is "main".
        familyGroups.sort((a, b) => Math.max(...b[1].map((t) => t.updatedAt)) - Math.max(...a[1].map((t) => t.updatedAt)));

        threadListEl.innerHTML = familyGroups.map(([rootId, members]) => {
          if (members.length === 1) return renderThreadItemRow(members[0], false);

          const rootMember = members.find((m) => m.id === rootId);
          // Falls back gracefully if the root itself was deleted or filtered
          // out by an active search -- never crashes on a missing root.
          const label = rootMember ? rootMember.title : members[0].title + ' (original not shown)';
          const isExpanded = expandedFamilyRoot === rootId;
          const hasActiveMember = members.some((m) => m.id === activeThreadId);
          const childrenHtml = isExpanded
            ? '<div class="family-children">' + members.map((m) => (
                '<div class="family-child-wrap">' +
                  renderThreadItemRow(m, true) +
                  '<div class="family-child-meta">' + (m.id === rootId ? 'Original' : 'Fork') + ' · ' + formatRelativeTime(m.updatedAt) + '</div>' +
                '</div>'
              )).join('') + '</div>'
            : '';
          return '<div class="family-row ' + (hasActiveMember ? 'active' : '') + '" data-root-id="' + rootId + '">' +
            '<span class="family-chevron">' + (isExpanded ? '▾' : '▸') + '</span>' +
            '<span class="thread-title">' + escapeHtml(label) + '</span>' +
            '<span class="family-count">' + members.length + '</span>' +
          '</div>' + childrenHtml;
        }).join('');
        if (renamingId !== null) {
          const input = threadListEl.querySelector('.thread-rename-input');
          if (input) { input.focus(); input.select(); }
        }
      } else {
        threadListEl.innerHTML = '<div class="empty-hint">' +
          (allThreads.length ? 'No conversations match your search.' : 'No saved conversations yet.') +
          '</div>';
      }
    }
    renderThreadList();

    function destroySession() {
      if (session) { try { session.destroy(); } catch {} }
      session = null;
    }

    function persistActiveThread() {
      const isNewThread = activeThreadId === null;
      if (isNewThread) activeThreadId = crypto.randomUUID();
      const index = loadIndex();
      const existing = index.find((t) => t.id === activeThreadId);
      const title = existing ? existing.title : titleFrom(messages[0]?.content || 'New chat');
      const updated = index.filter((t) => t.id !== activeThreadId);
      const entry = { id: activeThreadId, title, updatedAt: Date.now() };
      // Lineage fields, once set, must survive every later save of this same
      // thread -- persistActiveThread rebuilds the whole index entry from
      // scratch each time, so without this they'd silently vanish after the
      // fork's very first message.
      if (isNewThread && pendingForkMeta) {
        entry.forkedFrom = pendingForkMeta.forkedFrom;
        entry.forkRoot = pendingForkMeta.forkRoot;
        pendingForkMeta = null;
      } else if (existing && existing.forkedFrom) {
        entry.forkedFrom = existing.forkedFrom;
        entry.forkRoot = existing.forkRoot;
      }
      updated.push(entry);
      saveIndex(updated);
      // Strip the blob URL before persisting -- it's a plain string so it
      // WOULD serialize "successfully", but blob URLs don't survive a reload
      // (the page that created them is gone), so a saved one would just be a
      // dead reference producing a broken image rather than the honest
      // "not saved across reloads" marker. The in-memory `messages` array
      // keeps the real attachmentUrl for as long as this page stays loaded;
      // only the saved copy drops it.
      const storableMessages = messages.map((m) => {
        if (!m.attachmentUrl) return m;
        const { attachmentUrl, ...rest } = m;
        return rest;
      });
      saveThreadMessages(activeThreadId, storableMessages);
      renderThreadList();
    }

    function titleFrom(text) {
      const t = text.trim().replace(/\s+/g, ' ');
      return t.length > 40 ? t.slice(0, 40) + '…' : t;
    }

    function closeSidebarMobile() {
      sidebar.classList.remove('open');
      sidebarOverlay.classList.remove('visible');
    }

    function startNewChat() {
      destroySession();
      activeThreadId = null;
      messages = [];
      streaming = false;
      editingIndex = null;
      stickToBottom = true;
      renderChat();
      renderThreadList();
      chatNote.textContent = '';
      chatNote.classList.remove('warn');
      closeSidebarMobile();
    }

    async function openThread(id) {
      destroySession();
      activeThreadId = id;
      messages = loadThreadMessages(id);
      streaming = false;
      editingIndex = null;
      stickToBottom = true;
      renderChat();
      renderThreadList();
      // Fetching real attachment blobs from IndexedDB is async -- render the
      // text immediately (same as everywhere else in this app) rather than
      // blocking on it, then re-render once images/audio are ready. Guarded
      // by activeThreadId in case the visitor's already opened a different
      // thread by the time this resolves.
      hydrateAttachments(messages).then(() => { if (activeThreadId === id) renderChat(); });
      closeSidebarMobile();
      if (!promptOk) return;
      chatSendBtn.disabled = true;
      chatNote.textContent = 'Loading this conversation into the model…';
      try {
        session = await LanguageModel.create({
          initialPrompts: [{ role: 'system', content: SYSTEM_PROMPT }, ...messages.map((m) => ({ role: m.role, content: m.content }))],
          expectedInputs: [{ type: 'text' }, { type: 'image' }, { type: 'audio' }],
        });
        chatNote.textContent = '';
        warnIfNearLimit();
      } catch (e) {
        chatNote.textContent = 'Could not restore into the model: ' + e.message;
      }
      chatSendBtn.disabled = false;
    }

    // Reads the session's own real contextUsage/contextWindow numbers rather
    // than estimating from message length -- warns before a visitor actually
    // hits a hard QuotaExceededError, not after.
    function warnIfNearLimit() {
      if (!session || session.contextUsage == null || session.contextWindow == null) return;
      const ratio = session.contextUsage / session.contextWindow;
      if (ratio > 0.85) {
        chatNote.textContent = (chatNote.textContent ? chatNote.textContent + ' ' : '') +
          'This conversation is getting close to its context limit — consider starting a new chat soon.';
        chatNote.classList.add('warn');
      } else {
        chatNote.classList.remove('warn');
      }
    }

    newChatBtn.addEventListener('click', startNewChat);
    function renameThread(id, newTitle) {
      const title = newTitle.trim();
      if (!title) return; // an empty submit just cancels, same as Escape
      const index = loadIndex();
      const t = index.find((th) => th.id === id);
      if (t) { t.title = title; saveIndex(index); }
    }

    threadListEl.addEventListener('click', (e) => {
      const familyRow = e.target.closest('.family-row');
      if (familyRow) {
        const rootId = familyRow.dataset.rootId;
        expandedFamilyRoot = expandedFamilyRoot === rootId ? null : rootId;
        renderThreadList();
        return;
      }
      const delBtn = e.target.closest('.thread-delete');
      if (delBtn) {
        const id = delBtn.dataset.id;
        if (pendingDeleteId === id) {
          // Second click on the same delete button within the timeout --
          // actually delete now.
          clearTimeout(pendingDeleteTimer);
          pendingDeleteId = null;
          deleteThread(id);
          if (id === activeThreadId) startNewChat(); else renderThreadList();
        } else {
          // First click -- arm confirmation rather than deleting outright.
          // Auto-reverts after a few seconds so it doesn't stay in a
          // confusing "Sure?" state if the visitor walks away.
          pendingDeleteId = id;
          renderThreadList();
          clearTimeout(pendingDeleteTimer);
          pendingDeleteTimer = setTimeout(() => { pendingDeleteId = null; renderThreadList(); }, 3000);
        }
        return;
      }
      const renameBtn = e.target.closest('.thread-rename');
      if (renameBtn) {
        renamingId = renameBtn.dataset.id;
        renderThreadList();
        return;
      }
      if (e.target.closest('.thread-rename-input')) return; // let the input handle its own clicks/typing
      const item = e.target.closest('.thread-item');
      if (item) openThread(item.dataset.id);
    });
    threadListEl.addEventListener('keydown', (e) => {
      if (!e.target.matches('.thread-rename-input')) return;
      if (e.key === 'Enter') {
        e.preventDefault();
        renameThread(e.target.dataset.id, e.target.value);
        renamingId = null;
        renderThreadList();
      } else if (e.key === 'Escape') {
        e.preventDefault();
        renamingId = null;
        renderThreadList();
      }
    });
    threadListEl.addEventListener('blur', (e) => {
      if (!e.target.matches('.thread-rename-input') || renamingId === null) return;
      renameThread(e.target.dataset.id, e.target.value);
      renamingId = null;
      renderThreadList();
    }, true); // capture -- blur doesn't bubble

    threadSearchInput.addEventListener('input', () => {
      searchQuery = threadSearchInput.value;
      renderThreadList();
    });

    hamburgerBtn.addEventListener('click', () => {
      sidebar.classList.add('open');
      sidebarOverlay.classList.add('visible');
    });
    sidebarOverlay.addEventListener('click', closeSidebarMobile);
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSidebarMobile(); });

    function autoResize() {
      chatInput.style.height = 'auto';
      chatInput.style.height = chatInput.scrollHeight + 'px';
    }
    chatInput.addEventListener('input', autoResize);

    attachBtn.addEventListener('click', () => attachInput.click());
    attachInput.addEventListener('change', () => {
      const file = attachInput.files[0];
      if (!file) return;
      const type = file.type.startsWith('image/') ? 'image' : file.type.startsWith('audio/') ? 'audio' : null;
      if (!type) {
        chatNote.textContent = 'Only image or audio files can be attached.';
        attachInput.value = '';
        return;
      }
      pendingAttachment = { file, type };
      attachmentNameEl.textContent = file.name;
      attachmentChip.style.display = 'flex';
    });
    removeAttachmentBtn.addEventListener('click', () => {
      pendingAttachment = null;
      attachInput.value = '';
      attachmentChip.style.display = 'none';
    });

    let abortController = null;

    // Shared by a fresh send and (later) regenerate -- takes the exact turn
    // content to send, assumes the user-side message is already in
    // `messages` and rendered. Owns the streaming loop, the Stop button
    // wiring, and persisting the thread once the reply is done.
    async function streamReply(turnInput) {
      const assistantMsg = { role: 'assistant', content: '' };
      messages.push(assistantMsg);
      streaming = true;
      abortController = new AbortController();
      chatSendBtn.style.display = 'none';
      chatStopBtn.style.display = 'flex';
      renderChat();
      try {
        const stream = session.promptStreaming(turnInput, { signal: abortController.signal });
        for await (const chunk of stream) {
          assistantMsg.content += chunk;
          renderChat();
        }
        chatNote.textContent = '';
      } catch (e) {
        chatNote.textContent = e.name === 'AbortError' ? 'Stopped.' : 'Error: ' + e.message;
      }
      streaming = false;
      abortController = null;
      chatSendBtn.style.display = 'flex';
      chatStopBtn.style.display = 'none';
      renderChat(); // re-render once more so the finished (or stopped) reply gets its Copy button
      warnIfNearLimit();
      persistActiveThread();
    }

    chatStopBtn.addEventListener('click', () => {
      if (abortController) abortController.abort();
    });

    // Given a message that's about to be dropped by a truncating slice()
    // (edit/fork/regenerate all do this), pulls out enough to carry its
    // attachment forward onto the replacement message sendText builds --
    // same attachmentId/url reused (not re-stored under a new id), plus the
    // real blob refetched from IndexedDB so the *model* actually sees the
    // image again too, not just the redisplayed transcript. Without this,
    // editing or regenerating a message that had an attachment would
    // silently drop it from both the visible conversation and the model's
    // context, and orphan its blob in IndexedDB with nothing left to
    // reference it (confirmed as a real, reproducible bug before this fix).
    async function carryAttachmentFrom(m) {
      if (!m.attachmentId) return null;
      let blob = null;
      try { blob = await getBlob(m.attachmentId); } catch { /* falls back to a text-only resend below */ }
      return { type: m.attachmentType, id: m.attachmentId, url: m.attachmentUrl, blob };
    }

    // Shared by a normal send, edit-and-resend, fork, and regenerate. Assumes
    // `messages` already holds whatever prefix should survive (empty for a
    // brand-new chat, or a truncated prior history otherwise). `attachment`
    // is a fresh upload (mints a new stored blob + id); `carried` is an
    // existing attachment being carried forward onto the replacement message
    // (reuses its id/url, no duplicate blob stored) -- exactly one of the
    // two is ever passed, never both.
    async function sendText(text, attachment, carried) {
      if ((!text && !attachment && !carried) || !promptOk) return;
      chatSendBtn.disabled = true;
      const userMsg = { role: 'user', content: text };
      let modelAttachment = null; // { type, file } actually sent to the model this turn
      if (attachment) {
        userMsg.attachmentType = attachment.type;
        userMsg.attachmentUrl = URL.createObjectURL(attachment.file);
        try { userMsg.attachmentId = await putBlob(attachment.file); }
        catch { /* real preview still works this session; just won't survive a reload */ }
        modelAttachment = attachment;
      } else if (carried) {
        userMsg.attachmentType = carried.type;
        userMsg.attachmentId = carried.id;
        userMsg.attachmentUrl = carried.url || (carried.blob && URL.createObjectURL(carried.blob));
        if (carried.blob) modelAttachment = { type: carried.type, file: carried.blob };
      }
      messages.push(userMsg);
      stickToBottom = true;
      renderChat();
      chatNote.textContent = 'Generating…';

      try {
        if (!session) {
          chatNote.textContent = 'Starting session (may download the model on first use)…';
          // messages already includes the turn just pushed above -- seed
          // initialPrompts with everything BEFORE it. For a genuinely new
          // chat that's empty; after an edit/regenerate truncation it's the
          // real preserved history, so a freshly (re)created session doesn't
          // silently forget context that should still be there.
          session = await LanguageModel.create({
            initialPrompts: [{ role: 'system', content: SYSTEM_PROMPT }, ...messages.slice(0, -1).map((m) => ({ role: m.role, content: m.content }))],
            expectedInputs: [{ type: 'text' }, { type: 'image' }, { type: 'audio' }],
            monitor(m) {
              m.addEventListener('downloadprogress', (e) => {
                chatNote.textContent = 'Downloading model… ' + Math.round(e.loaded * 100) + '%';
              });
            },
          });
        }
        const content = [];
        if (text) content.push({ type: 'text', value: text });
        if (modelAttachment) content.push({ type: modelAttachment.type, value: modelAttachment.file });
        await streamReply([{ role: 'user', content }]);
      } catch (e) {
        chatNote.textContent = 'Error: ' + e.message;
      }
      chatSendBtn.disabled = false;
    }

    async function sendChat() {
      const text = chatInput.value.trim();
      const attachment = pendingAttachment;
      if ((!text && !attachment) || !promptOk) return;
      chatInput.value = '';
      autoResize();
      pendingAttachment = null;
      attachInput.value = '';
      attachmentChip.style.display = 'none';
      await sendText(text, attachment);
    }

    // Entering edit mode touches nothing but `editingIndex` -- messages,
    // the session, and everything else stay completely untouched until the
    // edit is actually confirmed. That's the whole fix for the earlier
    // behavior: clicking Edit used to truncate the conversation immediately,
    // with no way back if you changed your mind partway through.
    function startEdit(i) {
      if (streaming || editingIndex !== null) return;
      editingIndex = i;
      renderChat();
    }

    // Cancel reverts the display back to the plain bubble -- nothing was
    // ever mutated, so there's nothing to restore.
    function cancelEdit() {
      editingIndex = null;
      renderChat();
    }

    async function confirmEdit(i, newText) {
      const text = newText.trim();
      editingIndex = null;
      if (!text) { renderChat(); return; } // an empty submit just reverts, same as Cancel
      const carried = await carryAttachmentFrom(messages[i]);
      // Only now -- with a real, confirmed replacement text in hand -- do we
      // actually truncate and destroy the session. A live session's internal
      // context can't be rewound, so it's recreated (with whatever prefix
      // remains) the next time sendText runs.
      messages = messages.slice(0, i);
      destroySession();
      stickToBottom = true;
      await sendText(text, null, carried);
    }

    // Same truncation as confirmEdit, but the ORIGINAL thread is left
    // completely untouched -- forcing activeThreadId back to null makes
    // persistActiveThread() mint a fresh id the next time this gets saved
    // (inside sendText's streamReply call), rather than overwriting the
    // thread being forked from.
    async function forkFrom(i, newText) {
      const text = newText.trim();
      editingIndex = null;
      if (!text) { renderChat(); return; }

      const carried = await carryAttachmentFrom(messages[i]);
      const originalThreadId = activeThreadId;
      const originalEntry = loadIndex().find((t) => t.id === originalThreadId);
      const forkRoot = (originalEntry && originalEntry.forkRoot) || originalThreadId;

      messages = messages.slice(0, i);
      destroySession();
      activeThreadId = null;
      pendingForkMeta = { forkedFrom: originalThreadId, forkRoot };
      stickToBottom = true;
      await sendText(text, null, carried);
    }

    async function regenerateFrom(assistantIndex) {
      if (streaming || !session) return;
      const lastUserIndex = assistantIndex - 1;
      if (lastUserIndex < 0 || messages[lastUserIndex].role !== 'user') return;
      const textToResend = messages[lastUserIndex].content;
      const carried = await carryAttachmentFrom(messages[lastUserIndex]);
      // Same truncate-and-destroy path as editMessage, then immediately
      // resend the REAL prior text (not a filler string -- a real bug caught
      // in this exact spot during planning) plus its real attachment, if any
      // (a second real bug, caught by review after attachments shipped: this
      // used to resend text-only, silently dropping the image from both the
      // transcript and the model's context) so the visible transcript and
      // the model's actual context never diverge.
      messages = messages.slice(0, lastUserIndex);
      destroySession();
      stickToBottom = true;
      renderChat();
      await sendText(textToResend, null, carried);
    }

    chatSendBtn.addEventListener('click', sendChat);
    chatInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChat(); }
    });
  </script>
</body>
</html>
